name: ONE MORE Android
on:
  pull_request:
    paths: ['one-more-training/**', '.github/workflows/one-more-training-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: one-more-training
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Core one-rep and migration tests
        run: node --test tests/*.test.cjs
      - name: Phone-sized browser QA
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
          node scripts/browser-qa.cjs
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build new app and coexistence fixture
        run: |
          gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:lintDebug :app:lintRelease
          gradle --no-daemon -p ../daily-home-training :app:assembleDebug
          mkdir -p /tmp/one-more-v1
          git archive f04f0ddf2a87fa8971ba7282ddbfd01664f9b3bf one-more-training | tar -x -C /tmp/one-more-v1
          gradle --no-daemon -p /tmp/one-more-v1/one-more-training :app:assembleDebug
          cp /tmp/one-more-v1/one-more-training/app/build/outputs/apk/debug/app-debug.apk dist/ONE-MORE-v1.0.0-update-fixture.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/ONE-MORE-v1.1.0-ci.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/ONE-MORE-v1.1.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" dist/zipalign
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/ONE-MORE-v1.1.0-ci.apk > dist/badging.txt
          grep -F "name='com.andrefiker.onemore' versionCode='2' versionName='1.1.0'" dist/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/ONE-MORE-v1.1.0-ci.apk > dist/signature.txt
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions dist/ONE-MORE-v1.1.0-ci.apk | grep -q 'android.permission.INTERNET'
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Android install, offline workout and resume QA
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 12
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd one-more-training && node scripts/android-qa.cjs
      - name: Deliver build and QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-more-v1.1.0
          path: |
            one-more-training/dist/
            one-more-training/app/build/reports/lint-results-debug.html
          if-no-files-found: error
