level.magnets.forEach((m,i)=>{const mode=modes[i],c=mode===-1?'250,135,201':'107,233,233';if(mode){let g=ctx.createRadialGradient(m.x,m.y,7,m.x,m.y,102);g.addColorStop(0,`rgba(${c},.14)`);g.addColorStop(1,`rgba(${c},0)`);ctx.fillStyle=g;ctx.fillRect(m.x-102,m.y-102,204,204);ctx.strokeStyle=`rgba(${c},.18)`;ctx.lineWidth=.8;[38,57,78].forEach(r=>{ctx.setLineDash([3,6]);circle(m.x,m.y,r,null,`rgba(${c},.15)`);});ctx.setLineDash([]);for(let k=0;k<8;k++){let a=k*Math.PI/4,dx=Math.cos(a),dy=Math.sin(a),r=47;ctx.beginPath();ctx.moveTo(m.x+dx*33,m.y+dy*33);ctx.lineTo(m.x+dx*66,m.y+dy*66);ctx.stroke();let sign=mode===1?-1:1;let x=m.x+dx*r,y=m.y+dy*r;ctx.beginPath();ctx.moveTo(x-dx*sign*4-dy*3,y-dy*sign*4+dx*3);ctx.lineTo(x,y);ctx.lineTo(x-dx*sign*4+dy*3,y-dy*sign*4-dx*3);ctx.stroke();}}});
for(const o of level.obstacles){ctx.fillStyle='#473346';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle='#826078';ctx.lineWidth=1;ctx.strokeRect(o.x+.5,o.y+.5,o.w-1,o.h-1);ctx.save();ctx.beginPath();ctx.rect(o.x,o.y,o.w,o.h);ctx.clip();ctx.strokeStyle='#755265';ctx.lineWidth=2;for(let x=o.x-o.h;x<o.x+o.w;x+=9){ctx.beginPath();ctx.moveTo(x,o.y+o.h);ctx.lineTo(x+o.h,o.y);ctx.stroke();}ctx.restore();}
for(const h of level.hazards){circle(h.x,h.y,h.r,'#512438','#c97585');circle(h.x,h.y,h.r-5,null,'#a55370');text('×',h.x,h.y+5,20,'#ffacc4');}
if($('preview').checked&&state.status!=='running'){ctx.beginPath();preview.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle='#9fbdc075';ctx.lineWidth=1.5;ctx.setLineDash([2,6]);ctx.stroke();ctx.setLineDash([]);}
// Emitter.
ctx.fillStyle='#33263e';ctx.beginPath();ctx.roundRect(14,293,39,34,9);ctx.fill();ctx.strokeStyle='#a084b6';ctx.stroke();text('›',36,316,25,'#e3c7ef');text('EMIT',32,343,8,'#b79bc7',700);
// Collector.
const g=level.goal;let glow=ctx.createRadialGradient(g.x,g.y,4,g.x,g.y,34);glow.addColorStop(0,'#6be9e92a');glow.addColorStop(1,'#6be9e900');ctx.fillStyle=glow;ctx.fillRect(g.x-34,g.y-34,68,68);circle(g.x,g.y,21,null,'#6be9e93d',1);circle(g.x,g.y,16,'#17323b','#82f1ef',2);circle(g.x,g.y,10,null,'#6be9e96a',1);text('◇',g.x,g.y+5,17,'#9cf5ef');text('COLLECT',g.x,g.y<65?g.y+35:g.y-28,8,'#9bdfdf',750);
// Physical trail.
if(trail.length>1){ctx.beginPath();trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle='#fff0a952';ctx.lineWidth=2;ctx.stroke();}
level.magnets.forEach((m,i)=>{const mode=modes[i],c=mode===1?'#6be9e9':mode===-1?'#fa87c9':'#a18cae';circle(m.x,m.y,22,'#211b2c',mode?c:'#6d557d',1.3);circle(m.x,m.y,17,mode===1?'#21414a':mode===-1?'#48263f':'#31243d',mode?c:'#51405f',.8);text(mode===1?'−':mode===-1?'+':'○',m.x,m.y+7,24,c,500);text(m.label,m.y>350?m.x+31:m.x,m.y>350?m.y+4:m.y+35,10,c,800);});
const visible=state.status!=='won';if(visible){let x=state.x,y=state.y;ctx.shadowColor='#ffe8a2';ctx.shadowBlur=reduce?4:13;circle(x,y,7,'#fff1b8','#ffffff',1);ctx.shadowBlur=0;text('+',x,y+3,10,'#664b35',900);}if(paused){ctx.fillStyle='#140d207d';ctx.fillRect(0,30,360,360);ctx.fillStyle='#382640';ctx.beginPath();ctx.roundRect(110,180,140,50,15);ctx.fill();text('Ⅱ  PAUSED',180,211,16,'#f6dffa',750);}if(state.status==='lost'){circle(state.x,state.y,12,null,'#fa87c9',1.5);}
}
function frame(now){let dt=Math.min((now-last)/1000,.05);last=now;if(state.status==='running'&&!paused&&$('modal').hidden){acc+=dt;while(acc>=P.DT&&state.status==='running'){P.step(state,level,modes);acc-=P.DT;if(Math.floor(state.t/P.DT)%4===0)trail.push({x:state.x,y:state.y});if(trail.length>400)trail.shift();}if(state.status!=='running')finish();$('timer').textContent=`${state.t.toFixed(2)} s`;draw();}requestAnimationFrame(frame);}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*360/r.width,y=(e.clientY-r.top)*420/r.height;let i=level.magnets.findIndex(m=>Math.hypot(x-m.x,y-m.y)<29);if(i>=0){let order=[0,1,-1];setMode(i,order[(order.indexOf(modes[i])+1)%3]);}});
$('launch').onclick=launch;$('retry').onclick=reset;$('pause').onclick=pause;$('help').onclick=help;$('levels').onclick=chooseLevel;$('preview').onchange=draw;$('sound').onclick=()=>{sound=!sound;$('sound').setAttribute('aria-pressed',sound);$('sound').setAttribute('aria-label',`Turn sound ${sound?'off':'on'}`);$('sound').style.color=sound?'#6be9e9':'#aba0b8';tone(600);};
window.addEventListener('blur',()=>{if(state.status==='running'&&!paused)pause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.status==='running'&&!paused)pause();});document.addEventListener('keydown',e=>{if(!$('modal').hidden){if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const focusables=[...$('sheet').querySelectorAll('button')];const first=focusables[0],end=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){end.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===end){first.focus();e.preventDefault();}}}});
load(index);requestAnimationFrame(frame);try{if(!localStorage.getItem('magnet-lab-tutorial')&&!location.search.includes('qa=1'))help();}catch{help();}
if(new URLSearchParams(location.search).get('qa')==='1'){window.MagnetQA={load,mode:setMode,launch,pause,reset,closeModal,step(n=1){for(let i=0;i<n&&state.status==='running';i++)P.step(state,level,modes);if(state.status==='won'||state.status==='lost')finish();draw();return this.snapshot();},snapshot(){return {index,modes:[...modes],state:{...state},paused,progress:JSON.parse(JSON.stringify(progress)),attempts};},solutions:levels.map(l=>l.solution),solve(i,m=levels[i].solution){return P.simulate(levels[i],m);}};}
})();
