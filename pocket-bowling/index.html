<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101b29"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="src/style.css"><title>Pocket Bowling</title></head><body><main id="app"><header><button id="menu" aria-label="Open menu">☰</button><div><small>APPFARM · OFFLINE COLLECTION</small><h1>POCKET <b>BOWLING</b></h1></div><button id="scores" aria-label="Scorecard">▦</button></header><section id="hud"><div><small id="modeLabel">CLASSIC</small><strong id="frame">FRAME 1 <em>/ 10</em></strong></div><div class="score"><small>SCORE</small><strong id="total">0</strong></div><div><small>PERSONAL BEST</small><strong id="best">0</strong></div></section><div id="laneWrap"><canvas id="lane" aria-label="Bowling lane. Position the ball then swipe upward to bowl."></canvas><div id="announcement"><span id="badge">YOUR LANE. YOUR RHYTHM.</span><h2 id="message">Find your pocket.</h2><p id="hint">Slide to position · flick toward the pins</p></div><div id="power"><span></span></div><span id="laneNumber">LANE 01</span></div><section id="controls"><div class="sliders"><label>POSITION <input id="position" aria-label="Ball position" type="range" min="-45" max="45" value="0"></label><label>SPIN <output id="spinText">STRAIGHT</output><input id="spin" aria-label="Ball spin" type="range" min="-100" max="100" value="0"></label></div><div class="sliders"><label>AIM <input id="aim" aria-label="Launch angle" type="range" min="-5" max="5" step="0.1" value="0"></label><label>POWER <input id="strength" aria-label="Release power" type="range" min="0" max="100" value="75"></label></div><div class="actions"><button id="bowl" class="primary">BOWL <span>↗</span></button><button id="resetRack" hidden>Reset rack</button><button id="restart">New game</button></div><p id="footer">Flick up from the ball, or use aim &amp; BOWL.</p></section></main><dialog id="dialog"><div id="dialogHead"><h2 id="dialogTitle"></h2><button id="close" aria-label="Close dialog">✕</button></div><div id="dialogBody"></div></dialog><script type="module" src="src/app.js"></script></body></html>
