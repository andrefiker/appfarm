<body><main class="app">
<header><div class="brand"><span class="brand-mark">♠</span><div><span class="eyebrow">THE OFFLINE CARD ROOM</span><h1>Video Poker<span class="period">.</span></h1></div></div><button class="icon-button" id="settings" aria-label="Open settings">⚙</button></header>

<script>(function(root){

const names=['No win','Jacks or Better','Two Pair','Three of a Kind','Straight','Flush','Full House','Four of a Kind','Straight Flush','Royal Flush'];

 if(cards.length!==5||new Set(cards).size!==5||cards.some(c=>!Number.isInteger(c)||c<0||c>51))throw Error('Invalid hand');

 ranks.forEach(r=>counts[r]=(counts[r]||0)+1);

 const straight=new Set(ranks).size===5&&(ranks[4]-ranks[0]===4||ranks.join(',')==='2,3,4,5,14');
 if(flush&&straight)return ranks[0]===10?9:8;
 if(groups[0]===4)return 7;
 if(groups[0]===3&&groups[1]===2)return 6;
 if(flush)return 5;
 if(straight)return 4;
 if(groups[0]===3)return 3;
 if(groups[0]===2&&groups[1]===2)return 2;
 if(Object.keys(counts).some(r=>counts[r]===2&&Number(r)>=11))return 1;
 return 0;
}
function payout(category,bet){return category===9&&(bet===5||bet===10000||bet===50000)?800*bet:pays[category]*bet;}
function randomInt(n){const a=new Uint32Array(1),limit=4294967296-(4294967296%n);do{root.crypto.getRandomValues(a);}while(a[0]>=limit);return a[0]%n;}

 if(s.phase==='hold'||!bets.includes(s.bet)||s.credits<s.bet)return false;
 if(deck.length!==52||new Set(deck).size!==52||deck.some(c=>!Number.isInteger(c)||c<0||c>51))throw Error('Invalid deck');
 s.deck=deck.slice();s.hand=s.deck.splice(0,5);s.held.fill(false);s.credits-=s.bet;s.totalBet+=s.bet;s.lastWin=0;s.lastCategory=0;s.phase='hold';return true;

 if(s.phase!=='hold')return false;

 s.history.unshift({hand:s.hand.slice(),category:s.lastCategory,bet:s.bet,win:s.lastWin});s.history=s.history.slice(0,30);s.deck=[];s.phase='result';if(!bets.includes(s.bet))s.bet=500;return true;

 if(!s.settings||['sound','haptics','motion'].some(k=>typeof s.settings[k]!=='boolean'))return null;s.settings.motion=false;s.version=2;if(s.phase!=='hold'&&!bets.includes(s.bet))s.bet=500;return s;
 }catch{return null;}
}

</script><script>'use strict';

  }
  button.querySelector('.hold-label').textContent=holding?(held?'● HELD':'HOLD'):'\u00a0';
 });
 $('bets').innerHTML=P.bets.map(b=>`<button data-bet="${b}" class="${state.bet===b?'selected':''}" aria-label="Bet ${b.toLocaleString('en-US')} credits" aria-pressed="${state.bet===b}" ${holding?'disabled':''}>${b>=1000?b/1000+'K':b}</button>`).join('');
 const count=state.held.filter(Boolean).length;
 $('result').textContent=holding?'Make your hand.':state.phase==='ready'?'A fresh deck awaits.':state.lastWin?P.names[state.lastCategory]:'No winning hand.';
 $('instruction').textContent=holding?'Tap the cards you want to keep.':state.phase==='ready'?'Set your bet, then deal yourself in.':state.lastWin?`+${state.lastWin.toLocaleString('en-US')} credits returned · Bet ${state.history[0]?.bet ?? state.bet}`:'Deal when you’re ready.';

$('refill').onclick=()=>{if(state.phase!=='hold'&&state.credits<state.bet){state.credits+=Math.max(1000,state.bet-state.credits);changed();}};
const modal=$('modal');let lastFocus;
function openModal(title,html){lastFocus=document.activeElement;$('modalTitle').textContent=title;$('modalBody').innerHTML=html;modal.showModal();}
$('closeModal').onclick=()=>modal.close();modal.addEventListener('close',()=>lastFocus?.focus());modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close();}});
function showRules(){openModal('A little poker, at your pace.',`<ol><li>Choose a bet from <strong>500, 1,000, 10,000 or 50,000 credits</strong> and tap <strong>Deal hand</strong>. Your bet is deducted immediately.</li><li>Tap any cards you want to <strong>hold</strong>. Tap again to release.</li><li>Tap <strong>Draw cards</strong>. Unheld cards are replaced once from the remaining deck.</li><li>A pair of jacks, queens, kings or aces is the smallest paying hand. Payouts shown are the <strong>total credits returned</strong>, including your bet.</li></ol><p>Ace can be low in A–2–3–4–5 or high in 10–J–Q–K–A. No wild cards. Full house pays 9×; flush pays 6×. Royal flush pays 250× below 10,000, 8,000,000 at 10,000, or 40,000,000 at 50,000 credits. An unfinished hand from an older version keeps its original bet and payout.</p><p>Credits are fictional, free, and have no cash value. There are no purchases, ads or cash-outs. Your game stays on this device.</p>`);}
$('settings').onclick=()=>{openModal('Your card room',`<label class="setting">Sound<input type="checkbox" data-setting="sound" ${state.settings.sound?'checked':''}></label><label class="setting">Haptics, where supported<input type="checkbox" data-setting="haptics" ${state.settings.haptics?'checked':''}></label><p>Progress saves after every action, including held cards. Sound starts off.</p><button class="secondary" id="rules">How to play</button><button class="secondary" id="reset">Start a new session</button><p>Video Poker · 1.2.3<br>Built for offline play.</p>`);$('modalBody').onchange=e=>{if(e.target.dataset.setting){state.settings[e.target.dataset.setting]=e.target.checked;changed();}};$('rules').onclick=showRules;$('reset').onclick=()=>{openModal('Start fresh?',`<p>This clears your credits, statistics, hand history and any unfinished hand. You’ll start with 1,000 free credits.</p><button class="secondary" id="confirmReset">Yes, reset this session</button><button class="secondary" id="cancelReset">Keep playing</button>`);$('confirmReset').onclick=()=>{const settings=state.settings;state=P.fresh();state.settings=settings;changed();modal.close();};$('cancelReset').onclick=()=>modal.close();};};
$('history').onclick=()=>openModal('Your session',`<div class="stats"><div class="stat">Hands played<b>${state.hands}</b></div><div class="stat">Biggest payout<b>${state.best}</b></div><div class="stat">Total bet<b>${state.totalBet}</b></div><div class="stat">Total returned<b>${state.totalWon}</b></div></div><p>${state.history.length?'Most recent 30 completed hands.':'Your completed hands will appear here.'}</p>${state.history.map(h=>`<div class="history-row"><div><div class="mini-cards">${h.hand.map(c=>cardRank(c)+suits[Math.floor(c/13)]).join(' ')}</div><small>${P.names[h.category]} · Bet ${h.bet}</small></div><strong>+${h.win}</strong></div>`).join('')}`);
document.addEventListener('keydown',e=>{if(modal.open||e.repeat||e.target.tagName==='INPUT')return;if(/^[1-5]$/.test(e.key)&&state.phase==='hold'){state.held[+e.key-1]=!state.held[+e.key-1];changed();}if(e.key==='Enter'&&e.target===document.body){e.preventDefault();$('action').click();}});
render();if(saveFailed)$('saveNote').textContent='Saving is unavailable. Keep this window open to preserve your game.';
</script></body></html>
