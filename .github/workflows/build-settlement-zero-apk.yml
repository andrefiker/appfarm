name: Build Settlement Zero APK

on:
  push:
    branches: [ main ]
    paths:
      - 'settlement-zero-android/**'
      - '.github/workflows/build-settlement-zero-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: settlement-zero-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build and inspect APK
        run: |
          gradle --no-daemon :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Settlement-Zero.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Settlement-Zero.apk | head -n 4
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Settlement-Zero.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: settlement-zero-android
          path: settlement-zero-android/dist/Settlement-Zero.apk
          if-no-files-found: error
