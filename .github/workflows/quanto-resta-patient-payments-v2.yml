name: Build Gadgety v1.17

on:
  push:
    branches: [ quanto-resta-patient-payments-v2 ]
    paths:
      - 'quanto-resta-patient-payments-v2/**'
      - '.github/workflows/quanto-resta-patient-payments-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quanto-resta-patient-payments-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android API 35
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable Gadgety signing identity
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gadgety-signing
          key: gadgety-signing-v1
      - name: Prepare stable Gadgety signing identity
        shell: bash
        run: |
          set -eu
          KEY_DIR="$RUNNER_TEMP/gadgety-signing"
          KEYSTORE="$KEY_DIR/gadgety-release.p12"
          PASSWORD_FILE="$KEY_DIR/password"
          mkdir -p "$KEY_DIR"
          if [ ! -s "$KEYSTORE" ] || [ ! -s "$PASSWORD_FILE" ]; then
            PASSWORD=$(openssl rand -base64 36 | tr -dc 'A-Za-z0-9' | head -c 24)
            printf '%s' "$PASSWORD" > "$PASSWORD_FILE"
            keytool -genkeypair -noprompt -storetype PKCS12 \
              -keystore "$KEYSTORE" -storepass "$PASSWORD" -keypass "$PASSWORD" \
              -alias gadgety -keyalg RSA -keysize 4096 -validity 10000 \
              -dname 'CN=Gadgety Personal Release, OU=AppFarm, O=Andre Fiker, C=BR'
          fi
          PASSWORD=$(cat "$PASSWORD_FILE")
          echo "::add-mask::$PASSWORD"
          echo "GADGETY_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "GADGETY_STORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "GADGETY_KEY_ALIAS=gadgety" >> "$GITHUB_ENV"
          echo "GADGETY_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      - name: Unit tests, lint and APK build
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify package, version, manifest and signing
        run: |
          set -eu
          APK=app/build/outputs/apk/release/app-release.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p build/verification
          test -s "$APK"
          "$TOOLS/aapt" dump badging "$APK" > build/verification/badging.txt
          "$TOOLS/aapt" dump permissions "$APK" > build/verification/permissions.txt
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > build/verification/signing-gadgety-v1.17.txt
          grep -q "package: name='com.andrefiker.gadgety' versionCode='18' versionName='1.17'" build/verification/badging.txt
          if grep -Eq 'READ_CONTACTS|READ_SMS|ACCESS_FINE_LOCATION|INTERNET' build/verification/permissions.txt; then
            echo 'Unexpected sensitive/network permission found' >&2
            exit 1
          fi
          NEW_CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' build/verification/signing-gadgety-v1.17.txt | head -n 1)
          {
            echo "package_id=com.andrefiker.gadgety"
            echo "version_code=18"
            echo "version_name=1.17"
            echo "new_certificate_sha256=$NEW_CERT"
            echo 'side_by_side_with_loot=true'
            echo 'update_from_gadgety_v1_16=false'
            echo 'signing_baseline=gadgety_v1_17_stable'
            echo 'data_transfer=encrypted_backup_restore'
          } > build/verification/update-compatibility.txt
          sha256sum "$APK" > build/verification/apk-sha256.txt
          find app/build/test-results/testDebugUnitTest -name '*.xml' -print > build/verification/unit-test-files.txt
          grep -Rho '<testsuite[^>]*tests="[0-9]*"[^>]*failures="[0-9]*"[^>]*errors="[0-9]*"[^>]*skipped="[0-9]*"' \
            app/build/test-results/testDebugUnitTest 2>/dev/null > build/verification/unit-test-suites.txt || true
          cat build/verification/update-compatibility.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gadgety-v1.17-APK-and-verification
          path: |
            quanto-resta-patient-payments-v2/app/build/outputs/apk/release/app-release.apk
            quanto-resta-patient-payments-v2/build/verification/
            quanto-resta-patient-payments-v2/app/build/reports/tests/testDebugUnitTest/
            quanto-resta-patient-payments-v2/app/build/reports/lint-results-release.html
          if-no-files-found: error
