name: Quiet Peg Solitaire Android verification
on:
  push:
    branches: [peg-independent-qa-20261027]
    paths: ['quiet-peg-solitaire/**', '.github/workflows/quiet-peg-independent-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_AVD_HOME: /tmp/quiet-peg-avd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Rules and build
        run: |
          node quiet-peg-solitaire/tests/engine.test.js
          gradle --no-daemon -p quiet-peg-solitaire assembleDebug
      - name: Verify exact APK structure and bundled source
        run: |
          set -euo pipefail
          APK=quiet-peg-solitaire/app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/aapt" dump badging "$APK" | tee /tmp/peg-badging.txt
          grep -F "package: name='com.andrefiker.quietpegsolitaire' versionCode='3' versionName='1.0.2'" /tmp/peg-badging.txt
          "$TOOLS/aapt" dump permissions "$APK" | tee /tmp/peg-permissions.txt
          if grep -q "uses-permission" /tmp/peg-permissions.txt; then exit 1; fi
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$TOOLS/zipalign" -c -v 4 "$APK"
          unzip -Z1 "$APK" | grep '^assets/'
          for file in index.html style.css app.js engine.js; do
            unzip -p "$APK" "assets/$file" | cmp - "quiet-peg-solitaire/app/src/main/assets/$file"
          done
          sha256sum "$APK" | tee /tmp/peg-apk.sha256
      - name: Compare public preview signing certificates
        run: |
          set -euo pipefail
          APK=quiet-peg-solitaire/app/build/outputs/apk/debug/app-debug.apk
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          curl -fsSL 'https://github.com/andrefiker/appfarm/releases/download/quiet-peg-solitaire-v1.0.1/Quiet-Peg-Solitaire-v1.0.1.apk' -o /tmp/peg-v101.apk
          echo '36edb8c420b1caf1ce9b6b77ff988f1081d486a8d2d3fe3a7a0928854aca9df8  /tmp/peg-v101.apk' | sha256sum -c -
          "$SIGNER" verify --verbose --print-certs /tmp/peg-v101.apk | tee /tmp/peg-v101-signature.txt
          "$SIGNER" verify --verbose --print-certs "$APK" | tee /tmp/peg-candidate-signature.txt
          old=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/peg-v101-signature.txt)
          new=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/peg-candidate-signature.txt)
          test -n "$old" && test -n "$new"
          if [ "$old" = "$new" ]; then echo 'SIGNING_CONTINUITY=matching'; else echo 'SIGNING_CONTINUITY=different; APK cannot update the installed preview'; fi
      - name: Prepare emulator
        run: |
          sudo chmod a+rw /dev/kvm
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64' >/dev/null || true
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n peg -k 'system-images;android-35;google_apis;x86_64' --force
          test -f "$ANDROID_AVD_HOME/peg.ini"
          "$ANDROID_HOME/emulator/emulator" -avd peg -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -memory 2048 > /tmp/emulator.log 2>&1 &
          timeout 300 adb wait-for-device
          timeout 300 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 3; done'
          adb shell input keyevent 82
      - name: Install and launch
        run: |
          adb install -r quiet-peg-solitaire/app/build/outputs/apk/debug/app-debug.apk
          adb shell am start -W -n com.andrefiker.quietpegsolitaire/.MainActivity
          adb shell pidof com.andrefiker.quietpegsolitaire
          sleep 10
          adb shell uiautomator dump /sdcard/window.xml
          adb exec-out cat /sdcard/window.xml > /tmp/window.xml
          python3 quiet-peg-solitaire/tests/android-smoke.py /tmp/window.xml
      - name: Record tested APK checksum
        run: sha256sum -c /tmp/peg-apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-peg-tested-debug-apk
          path: quiet-peg-solitaire/app/build/outputs/apk/debug/app-debug.apk
      - name: Emulator diagnostics on failure
        if: failure()
        run: |
          tail -100 /tmp/emulator.log || true
          adb logcat -d -t 300 || true
