name: Quiet Knight Animal Kingdom APK

on:
  push:
    branches: [ feature/quiet-knight-animal-kingdom ]
    paths:
      - 'quiet-knight-server/frontend/**'
      - 'quiet-knight-server/frontend-acceptance/**'
      - 'android-store/**'
      - '.github/workflows/quiet-knight-animal-kingdom.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: quiet-knight-animal-kingdom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-quiet-knight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: qk_test
          POSTGRES_DB: qk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d qk_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Cancel superseded builds of this workflow and development branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quiet-knight-animal-kingdom.yml/runs?branch=feature%2Fquiet-knight-animal-kingdom&status=in_progress" \
            --jq ".workflow_runs[] | select(.id < $GITHUB_RUN_ID) | .id" | while read -r old_run_id; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$old_run_id/cancel"
          done

      - name: Check out source
        uses: actions/checkout@v4

      - name: Retire this task's temporary raw debug-key artifacts and cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=quiet-knight-studio-private-debug-key" --jq '.artifacts[] | select(.name == "quiet-knight-studio-private-debug-key") | .id' | while read -r artifact_id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?key=quiet-knight-studio-debug-key-v1" --jq '.actions_caches[] | select(.key == "quiet-knight-studio-debug-key-v1" and .ref == "refs/heads/feature/quiet-knight-animal-kingdom") | .id' | while read -r cache_id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$cache_id"
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quiet-knight-server/frontend/package-lock.json

      - name: Build the static game
        working-directory: quiet-knight-server/frontend
        run: |
          npm ci
          npm run test:animal
          npm run test:account
          npm run test:studio
          npx tsc --noEmit
          npm run build -- --base=./

      - name: Bundle the game into the existing Android app
        run: |
          mkdir -p android-store/app/src/main/assets/quiet-knight
          cp -R quiet-knight-server/frontend/dist/. android-store/app/src/main/assets/quiet-knight/
          test -s android-store/app/src/main/assets/quiet-knight/index.html
          find android-store/app/src/main/assets/quiet-knight -type f | sort

      - name: Test real account HTTP against isolated PostgreSQL and Redis
        working-directory: quiet-knight-server
        env:
          DATABASE_URL: postgresql://postgres:qk_test@127.0.0.1:5432/qk_test
          REDIS_URL: redis://127.0.0.1:6379
          QK_APPLY_IDENTITY_MIGRATIONS: 'true'
        run: |
          npm ci
          npm run test:identity
          npm run test:frontend-delivery
          npm run test:migration-safety
          npm run migrate:identity
          npm run test:auth-http
          mkdir -p public
          cp -R frontend/dist/. public/
          node predeploy.js

      - name: Rendered untimed and legacy-clock acceptance on isolated candidate
        timeout-minutes: 5
        working-directory: quiet-knight-server/frontend-acceptance
        env:
          DATABASE_URL: postgresql://postgres:qk_test@127.0.0.1:5432/qk_test
          # Separate test DB: the preceding auth-abuse suite intentionally
          # exhausts registration limits. Keep those protections enabled.
          REDIS_URL: redis://127.0.0.1:6379/1
          FRONTEND_ORIGIN: http://127.0.0.1:3000
          QK_FRONTEND_URL: http://127.0.0.1:3000/
        run: |
          npm ci
          # Hosted Ubuntu already includes Chromium's shared libraries. Avoid
          # unrelated OS/font upgrades, which can stall on package mirrors.
          timeout --kill-after=10s 90s npx playwright install chromium --only-shell
          node ../server.js > "$RUNNER_TEMP/quiet-knight-browser-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 0.25
          done
          timeout --kill-after=10s 210s npx playwright test clock.spec.js guest.spec.js studio.spec.js reference-table.spec.js haptics.spec.js rematch.spec.js --global-timeout=180000

      - name: Upload synthetic rendered QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiet-knight-clock-rendered-qa
          path: quiet-knight-server/frontend-acceptance/output/playwright/*.png
          if-no-files-found: ignore
          retention-days: 1

      - name: Set up Java 17 and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify the runner-provided Android SDK
        run: |
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android 35 build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Build without any signing identity. The retained-key gate below stays
      # closed unless its secret is supplied; the owner can sign this candidate
      # locally without uploading a private keystore to the runner.
      - name: Assemble unsigned candidate for local retained-key signing
        working-directory: android-store
        run: |
          cat > "$RUNNER_TEMP/qk-unsigned.gradle" <<'GRADLE'
          allprojects { p ->
            p.plugins.withId('com.android.application') {
              p.android.buildTypes.debug.signingConfig = null
            }
          }
          GRADLE
          gradle --no-daemon -I "$RUNNER_TEMP/qk-unsigned.gradle" :app:assembleQuietKnightDebug
          apk_path="$(find app/build/outputs/apk/quietKnight/debug -name '*.apk' -type f -print -quit)"
          test -n "$apk_path"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk_path"
          mkdir -p "$RUNNER_TEMP/qk-unsigned"
          cp "$apk_path" "$RUNNER_TEMP/qk-unsigned/Quiet-Knight-unsigned.apk"
          sha256sum "$RUNNER_TEMP/qk-unsigned/Quiet-Knight-unsigned.apk"

      - name: Preserve unsigned candidate for local signing
        uses: actions/upload-artifact@v4
        with:
          name: quiet-knight-unsigned-candidate
          path: ${{ runner.temp }}/qk-unsigned/Quiet-Knight-unsigned.apk
          if-no-files-found: error
          retention-days: 1

      - name: Prepare the retained test signing key
        env:
          QK_STUDIO_SIGNING_STORE: ${{ secrets.QK_STUDIO_SIGNING_STORE }}
        run: |
          mkdir -p "$RUNNER_TEMP/qk-signing"
          if [ -n "$QK_STUDIO_SIGNING_STORE" ]; then
            printf '%s' "$QK_STUDIO_SIGNING_STORE" | base64 --decode > "$RUNNER_TEMP/qk-signing/candidate.keystore"
          elif [ -f quiet-knight-server/docs/candidate-signing.sha256 ]; then
            echo 'The retained test signing identity must be supplied; refusing to replace it with a new key.' >&2
            exit 1
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/qk-signing/candidate.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Quiet Knight Test, O=AppFarm, C=BR'
          fi
          if [ -f quiet-knight-server/docs/candidate-signing.sha256 ]; then
            keytool -exportcert -keystore "$RUNNER_TEMP/qk-signing/candidate.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/qk-signing/actual.sha256"
            diff quiet-knight-server/docs/candidate-signing.sha256 "$RUNNER_TEMP/qk-signing/actual.sha256"
          fi

      - name: Assemble signed debug APK
        working-directory: android-store
        env:
          QK_CANDIDATE_STORE: ${{ runner.temp }}/qk-signing/candidate.keystore
        run: gradle --no-daemon :app:assembleQuietKnightDebug

      - name: Verify package, signature, permissions, and bundled game assets
        working-directory: android-store
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/quietKnight/debug/app-quietKnight-debug.apk dist/QuietKnight-Animal-Kingdom-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/QuietKnight-Animal-Kingdom-debug.apk | head -n 4
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions dist/QuietKnight-Animal-Kingdom-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/QuietKnight-Animal-Kingdom-debug.apk
          unzip -l dist/QuietKnight-Animal-Kingdom-debug.apk | grep -E 'assets/quiet-knight/(index.html|assets/.*\.(js|css))' | head -n 20
          unzip -l dist/QuietKnight-Animal-Kingdom-debug.apk | grep -q 'assets/quiet-knight/index.html'
          for army in ivory ebony; do
            for piece in king queen bishop knight rook pawn; do
              unzip -Z1 dist/QuietKnight-Animal-Kingdom-debug.apk | grep -Fxq "assets/quiet-knight/animal-kingdom/pieces/${army}-${piece}.png"
            done
          done
          if unzip -p dist/QuietKnight-Animal-Kingdom-debug.apk 'assets/quiet-knight/assets/*.js' | grep -Eq 'https?://(localhost|127\.0\.0\.1)'; then
            echo 'Bundled game must not depend on a local development server' >&2
            exit 1
          fi
          sha256sum dist/QuietKnight-Animal-Kingdom-debug.apk

      - name: Encrypt the retained test signing identity for the owner
        run: |
          openssl rand -hex 32 > "$RUNNER_TEMP/qk-signing/password"
          openssl enc -aes-256-cbc -salt -pbkdf2 -in "$RUNNER_TEMP/qk-signing/candidate.keystore" -out "$RUNNER_TEMP/qk-signing/candidate.keystore.enc" -pass file:"$RUNNER_TEMP/qk-signing/password"
          openssl pkeyutl -encrypt -pubin -inkey android-store/quiet-knight-studio-artifact-public.pem -in "$RUNNER_TEMP/qk-signing/password" -out "$RUNNER_TEMP/qk-signing/password.enc" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256

      - name: Preserve encrypted candidate signing identity
        uses: actions/upload-artifact@v4
        with:
          name: quiet-knight-studio-encrypted-debug-key
          path: |
            ${{ runner.temp }}/qk-signing/candidate.keystore.enc
            ${{ runner.temp }}/qk-signing/password.enc
          if-no-files-found: error
          retention-days: 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quiet-knight-animal-kingdom-debug-apk
          path: android-store/dist/QuietKnight-Animal-Kingdom-debug.apk
          if-no-files-found: error
          retention-days: 1
