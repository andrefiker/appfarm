name: Pocket Bowling verify and release
on:
  push:
    branches: [codex/pocket-bowling-v1.0.0]
    paths: ['pocket-bowling/**', '.github/workflows/pocket-bowling-release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pocket-bowling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run build
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: node scripts/browser-qa.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify the exact locally built release candidate
        run: |
          cp release/Pocket-Bowling-v1.0.0.apk .
          mkdir -p android-build
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Pocket-Bowling-v1.0.0.apk > android-build/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions Pocket-Bowling-v1.0.0.apk > android-build/permissions.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Pocket-Bowling-v1.0.0.apk | tee android-build/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 Pocket-Bowling-v1.0.0.apk > android-build/alignment.txt
          python3 scripts/verify-apk.py
          sha256sum -c release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-bowling-verification
          path: |
            pocket-bowling/qa-artifacts/
            pocket-bowling/android-build/*.txt
  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd pocket-bowling && node scripts/emulator-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-bowling-android-qa
          path: pocket-bowling/qa-artifacts/
  publish:
    needs: [verify, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified APK without merging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=pocket-bowling-v1.0.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" pocket-bowling/release/Pocket-Bowling-v1.0.0.apk pocket-bowling/release/SHA256SUMS.txt --title 'Pocket Bowling v1.0.0' --notes-file pocket-bowling/RELEASE_NOTES.md --target "$GITHUB_SHA"
