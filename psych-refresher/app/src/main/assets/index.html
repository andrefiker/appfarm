<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131817">
  <meta name="description" content="An offline companion for a continuing psychology seminar.">
  <title>Psych Refresher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#today" aria-label="Psych Refresher home"><span class="mark">P<span>·</span>R</span><span>PSYCH<br>REFRESHER</span></a>
      <div class="top-meta"><span id="today-date"></span><span class="offline"><i></i> ON DEVICE</span></div>
    </header>
    <section id="screen" class="screen" aria-live="polite"></section>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-button active" data-tab="today"><span class="nav-icon">◷</span><span>TODAY</span></button>
      <button class="nav-button" data-tab="topics"><span class="nav-icon">▦</span><span>TOPICS</span></button>
      <button class="nav-button" data-tab="papers"><span class="nav-icon">≡</span><span>PAPERS</span></button>
      <button class="nav-button" data-tab="review"><span class="nav-icon">↻</span><span>REVIEW</span></button>
    </nav>
  </main>
  <dialog id="editor" class="editor"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
