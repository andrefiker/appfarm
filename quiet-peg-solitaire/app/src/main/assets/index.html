<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="color-scheme" content="dark light"><title>Quiet Peg Solitaire</title><link rel="stylesheet" href="style.css"></head><body data-theme="wood"><main id="app"><header><div><span class="eyebrow">A MOMENT TO THINK</span><h1>Quiet Peg <em>Solitaire</em></h1></div><button id="menuBtn" class="small" aria-label="Open menu">☰</button></header><section id="home" class="panel"><p class="intro">One peg at a time.</p><label>Board <select id="variant"><option value="english">English · 33 holes</option><option value="european">European · 37 holes</option><option value="triangle">Triangle · 15 holes</option></select></label><label>Mode <select id="mode"><option value="classic">Classic</option><option value="zen">Zen</option><option value="time">Time trial</option><option value="challenge">Challenges</option><option value="daily">Daily puzzle</option></select></label><button id="play" class="primary">Play</button><button id="resume">Resume game</button><div class="row"><button id="daily">Daily</button><button id="challenge">Challenges</button></div><div class="row"><button id="statsBtn">Statistics</button><button id="settingsBtn">Settings</button></div></section><section id="game" hidden><div class="meta"><div><span id="boardName"></span><strong id="remaining"></strong></div><div><span>Moves</span><strong id="moves"></strong></div><div><span id="timeLabel">Time</span><strong id="timer"></strong></div></div><div class="board-wrap"><div id="board" role="group" aria-label="Peg solitaire board"></div></div><p id="message" role="status" aria-live="polite">Select a peg, then a highlighted hole.</p><div class="controls"><button id="undo">↶<small>Undo</small></button><button id="redo">↷<small>Redo</small></button><button id="hint">✧<small>Hint</small></button><button id="restart">⟳<small>Restart</small></button><button id="new">＋<small>New</small></button></div></section><section id="settings" class="panel" hidden><h2>Settings</h2><label>Theme <select id="theme"><option value="wood">Wooden classic</option><option value="minimal">Minimal</option><option value="dark">Dark zen</option></select></label><label>Controls <select id="hand"><option value="left">Left-handed</option><option value="right">Right-handed</option></select></label><label class="check"><input type="checkbox" id="sound"> Sound</label><label class="check"><input type="checkbox" id="haptics"> Haptics</label><label class="check"><input type="checkbox" id="motion"> Reduced motion</label><button class="back">Back</button></section><section id="stats" class="panel" hidden><h2>Statistics</h2><div id="statsContent"></div><button id="resetStats">Reset statistics</button><button class="back">Back</button></section><section id="finish" class="overlay" hidden><div class="dialog"><span class="eyebrow">PUZZLE COMPLETE</span><h2 id="finishTitle"></h2><p id="finishDetails"></p><button id="again" class="primary">Play again</button><button id="finishUndo">Undo last move</button><button id="finishMenu">Menu</button></div></section></main><script src="engine.js"></script><script src="app.js"></script></body></html>
