name: Quiet Knight Forest APK
on:
  push:
    branches: [codex/quiet-knight-forest-20261121]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quiet-knight-server/frontend/package-lock.json
      - name: Verify Amateur Mode, legacy teaching and settlement
        working-directory: quiet-knight-server
        run: |
          npm ci --ignore-scripts
          node --check server.js
          node --test tests/amateur.test.mjs tests/teaching.test.mjs tests/teaching-settlement.test.mjs tests/series-score.test.mjs
          node tests/teaching-http-ci.mjs
      - name: Check and build game
        working-directory: quiet-knight-server/frontend
        run: |
          npm ci
          npx tsc --noEmit
          node --experimental-strip-types tests/piece-captures.test.mjs
          node --experimental-strip-types tests/table-preferences.test.mjs
          node --experimental-strip-types tests/head-to-head.test.mjs
          node --experimental-strip-types tests/haptics.test.mjs
          node --experimental-strip-types tests/amateur-threats.test.mjs
          node tests/clean-table.test.mjs
          npm run test:review
          npm run test:effects
          node --experimental-strip-types tests/studio-rules.test.mjs
          npm run test:archive
          npm run build -- --base=./
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Bundle only this build
        run: |
          mkdir -p android-store/app/src/main/assets/quiet-knight
          cp -R quiet-knight-server/frontend/dist/. android-store/app/src/main/assets/quiet-knight/
      - name: Compile Android release
        working-directory: android-store
        run: gradle --no-daemon --console=plain -PqkStandaloneForest :app:assembleQuietKnightRelease
      - name: Prepare unsigned package and public verification tools
        run: |
          mkdir -p release
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 android-store/app/build/outputs/apk/quietKnight/release/app-quietKnight-release-unsigned.apk release/Quiet-Knight-Forest-1.6.20-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release/Quiet-Knight-Forest-1.6.20-unsigned.apk > release/badging.txt
          grep -F "name='com.andrefiker.quietknight.forest' versionCode='51' versionName='1.6.20'" release/badging.txt
          grep -F "application-label:'Quiet Knight Forest'" release/badging.txt
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" release/zipalign
          cp -R quiet-knight-server/frontend/dist release/web
          printf '%s\n' "$GITHUB_SHA" > release/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-knight-forest-1.6.20-unsigned
          path: release/
          retention-days: 7
