<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#121314">
  <title>Daily Training</title>
  <link rel="stylesheet" href="training.css">
</head>
<body>
  <main class="page">
    <header class="topline" aria-label="Selected training day">
      <button id="previous" class="date-arrow" type="button" aria-label="Previous day">‹</button>
      <div id="date" class="date-label"></div>
      <button id="next" class="date-arrow" type="button" aria-label="Next day">›</button>
    </header>
    <div class="list" id="exercise-list" aria-label="Today's exercises"></div>
    <footer class="bottom">
      <span id="save-status" class="save-status" aria-live="polite"></span>
      <button id="save" class="save-button" type="button">SAVE TODAY</button>
    </footer>
  </main>
  <script src="training.js"></script>
  <script>
    (function () {
      const bridge = window.LocalLedger;
      const storage = bridge ? {
        load: () => bridge.load(),
        save: value => bridge.save(value)
      } : {
        load: () => window.localStorage.getItem('daily-training-ledger') || '',
        save: value => window.localStorage.setItem('daily-training-ledger', value)
      };
      const model = new TrainingModel.TrainingModel(storage);
      const dateEl = document.getElementById('date');
      const list = document.getElementById('exercise-list');
      const status = document.getElementById('save-status');

      function formatDate(key) {
        const [y, m, d] = key.split('-').map(Number);
        return new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'short', day: 'numeric' }).format(new Date(y, m - 1, d, 12));
      }

      function paintValue(row, input, ex, target, value) {
        const complete = Number.isInteger(value) && value >= target;
        row.classList.toggle('is-complete', complete);
        row.querySelector('.completion').textContent = complete ? '✓' : '';
        input.setAttribute('aria-valuenow', value == null ? '0' : String(value));
      }

      function render() {
        const selectedDate = model.selectedDate;
        const day = model.getDay(selectedDate);
        dateEl.textContent = formatDate(selectedDate);
        list.replaceChildren();
        for (const ex of TrainingModel.EXERCISES) {
          const value = day.actual[ex.id];
          const row = document.createElement('section');
          row.className = 'exercise';
          const info = document.createElement('div');
          info.className = 'exercise-info';
          const title = document.createElement('div');
          title.className = 'exercise-name';
          title.textContent = ex.name;
          const details = document.createElement('div');
          details.className = 'details';
          details.textContent = TrainingModel.targetLabel(ex, day.target[ex.id]);
          info.append(title, details);

          const controls = document.createElement('div');
          controls.className = 'controls';
          const minus = document.createElement('button');
          minus.type = 'button';
          minus.className = 'stepper';
          minus.textContent = '−';
          minus.setAttribute('aria-label', `Decrease ${ex.name}`);
          const input = document.createElement('input');
          input.type = 'number';
          input.inputMode = 'numeric';
          input.min = '0';
          input.step = '1';
          input.autocomplete = 'off';
          input.setAttribute('aria-label', `${ex.name}, completed ${ex.unit}${ex.side ? ' ' + ex.side : ''}`);
          input.setAttribute('role', 'spinbutton');
          input.value = value == null ? '0' : String(value);
          const plus = document.createElement('button');
          plus.type = 'button';
          plus.className = 'stepper';
          plus.textContent = '+';
          plus.setAttribute('aria-label', `Increase ${ex.name}`);
          const check = document.createElement('span');
          check.className = 'completion';
          check.setAttribute('aria-label', 'Target reached');
          controls.append(minus, input, plus, check);

          const preview = document.createElement('div');
          preview.className = 'tomorrow';
          if (day.saved) {
            const next = model.getDay(TrainingModel.addDays(selectedDate, 1)).target[ex.id];
            preview.textContent = `Tomorrow ${next}${ex.side === 'per leg' ? ' / leg' : ex.side === 'per side' ? ' sec / side' : ` ${ex.unit}`}`;
          }

          const change = raw => {
            model.setActual(selectedDate, ex.id, raw);
            const current = model.getDay(selectedDate);
            paintValue(row, input, ex, current.target[ex.id], current.actual[ex.id]);
            status.textContent = model.getStatus(selectedDate);
            status.className = 'save-status unsaved';
            preview.textContent = '';
          };
          input.addEventListener('input', () => change(input.value));
          minus.addEventListener('click', () => {
            input.value = String(TrainingModel.adjustActual(input.value, -1));
            change(input.value);
          });
          plus.addEventListener('click', () => {
            input.value = String(TrainingModel.adjustActual(input.value, 1));
            change(input.value);
          });
          row.append(info, controls, preview);
          paintValue(row, input, ex, day.target[ex.id], value);
          list.append(row);
        }
        status.textContent = model.getStatus(selectedDate);
        status.className = `save-status ${day.saved ? 'saved' : 'unsaved'}`;
      }

      document.getElementById('previous').addEventListener('click', () => { model.shiftDate(-1); render(); });
      document.getElementById('next').addEventListener('click', () => { model.shiftDate(1); render(); });
      document.getElementById('save').addEventListener('click', () => { model.saveDay(model.selectedDate); render(); });
      render();
    })();
  </script>
</body>
</html>
