name: Pocket Counter APK

on:
  push:
    branches: [ fiker/pocket-counter-build-20261015 ]
    paths:
      - 'pocket-counter/**'
      - '.github/workflows/pocket-counter-build.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: pocket-counter
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run tests and build APK
        run: gradle --no-daemon testDebugUnitTest :app:assembleDebug
      - name: Verify APK package, signature, permissions, and hash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PocketCounter.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/PocketCounter.apk | head -n 4
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions dist/PocketCounter.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/PocketCounter.apk
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions dist/PocketCounter.apk | grep -q 'android.permission.INTERNET'
          sha256sum dist/PocketCounter.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketCounter-APK
          path: pocket-counter/dist/PocketCounter.apk
          if-no-files-found: error
          retention-days: 14
