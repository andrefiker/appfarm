plugins { id 'com.android.application' }
android {
    namespace 'com.andrefiker.clinicalcockpit'
    compileSdk 35
    defaultConfig {
        applicationId 'com.andrefiker.clinicalcockpit'
        minSdk 30
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        testInstrumentationRunner 'com.andrefiker.clinicalcockpit.SmokeRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
