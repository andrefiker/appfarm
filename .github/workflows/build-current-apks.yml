name: Build current AppFarm APKs

on:
  push:
    branches: [ main ]
    paths:
      - 'android-store/**'
      - '.github/workflows/build-current-apks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-store
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable APKs
        run: gradle --no-daemon :app:assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/quietKnight/debug/app-quietKnight-debug.apk dist/QuietKnight.apk
          cp app/build/outputs/apk/performanceCourse/debug/app-performanceCourse-debug.apk dist/PsicologiaDesempenho.apk
          cp app/build/outputs/apk/appFarm/debug/app-appFarm-debug.apk dist/AppFarm.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/QuietKnight.apk | head -n 4
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/PsicologiaDesempenho.apk | head -n 4
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/AppFarm.apk | head -n 4

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: appfarm-current-apks
          path: android-store/dist/*.apk
          if-no-files-found: error

      - name: Publish stable download release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f appfarm-android-latest "$GITHUB_SHA"
          git push --force origin refs/tags/appfarm-android-latest
          gh release view appfarm-android-latest >/dev/null 2>&1 || gh release create appfarm-android-latest --title 'AppFarm Android — latest' --notes 'APKs instaláveis gerados automaticamente para os builds web atuais do AppFarm.' --target "$GITHUB_SHA"
          gh release upload appfarm-android-latest android-store/dist/QuietKnight.apk android-store/dist/PsicologiaDesempenho.apk android-store/dist/AppFarm.apk --clobber
