name: Quiet Knight UI polish candidate APK
on:
  push:
    branches: [codex/quiet-knight-ui-polish-20261120]
    paths:
      - '.github/workflows/quiet-knight-ui-polish-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: quiet-knight-server/frontend/package-lock.json
      - name: Validate and build frontend
        working-directory: quiet-knight-server/frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build -- --base=./
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle frontend
        run: |
          mkdir -p android-store/app/src/main/assets/quiet-knight
          cp -R quiet-knight-server/frontend/dist/. android-store/app/src/main/assets/quiet-knight/
      - name: Build isolated installable candidate
        working-directory: android-store
        run: gradle --no-daemon --console=plain :app:assembleQuietKnightDebug
      - name: Verify APK
        run: |
          mkdir -p release
          cp android-store/app/build/outputs/apk/quietKnight/debug/app-quietKnight-debug.apk release/Quiet-Knight-UI-Polish-Candidate.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/Quiet-Knight-UI-Polish-Candidate.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release/Quiet-Knight-UI-Polish-Candidate.apk | head -n 5
          unzip -t release/Quiet-Knight-UI-Polish-Candidate.apk | tail -n 1
          unzip -Z1 release/Quiet-Knight-UI-Polish-Candidate.apk | grep -q '^assets/quiet-knight/index.html$'
          sha256sum release/Quiet-Knight-UI-Polish-Candidate.apk
          printf '%s\n' "$GITHUB_SHA" > release/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-knight-ui-polish-candidate-apk
          path: release/
          if-no-files-found: error
          retention-days: 7
