<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b121e"><title>SAND LAB</title><link rel="stylesheet" href="style.css"></head><body>
<main id="app"><header><h1>SAND <span>LAB</span></h1><nav><button id="worlds">Worlds</button><button id="settings" aria-label="Settings">⚙</button></nav></header>
<section id="stage" aria-label="Simulation world"><canvas id="canvas" aria-label="Paint materials here"></canvas><div id="hint">Pour. Build. Ignite. Discover.</div><output id="stats" hidden></output><output id="probe" hidden></output></section>
<footer><div class="actions"><button id="pause">Ⅱ <span>Pause</span></button><button id="undo">↶ <span>Undo</span></button><button id="erase">◇ <span>Erase</span></button><button id="tools">⌁ <span>Tools</span></button></div><div id="palette" aria-label="Materials"></div><div class="adjust"><label for="size">Brush <output id="sizeValue">4</output></label><input id="size" type="range" min="1" max="20" value="4" aria-label="Brush radius"><select id="speed" aria-label="Simulation speed"><option value=".25">Slow</option><option value="1" selected>Normal</option><option value="2">Fast</option></select></div></footer></main>
<dialog id="panel"><div class="panel-head"><h2 id="panelTitle"></h2><button id="close" aria-label="Close panel">×</button></div><div id="panelBody"></div></dialog><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
