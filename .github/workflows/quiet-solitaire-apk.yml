name: Build Quiet Solitaire APK

on:
  pull_request:
    paths:
      - 'quiet-solitaire/package.json'
      - 'quiet-solitaire/index.html'
      - 'quiet-solitaire/manifest.webmanifest'
      - 'quiet-solitaire/service-worker.js'
      - 'quiet-solitaire/public/**'
      - 'quiet-solitaire/src/**'
      - 'quiet-solitaire/tests/**'
      - 'quiet-solitaire/scripts/**'
      - 'quiet-solitaire/android/**'
      - 'quiet-solitaire/build-android.sh'
      - '.github/workflows/quiet-solitaire-apk.yml'
  push:
    branches: [ main ]
    paths:
      - 'quiet-solitaire/package.json'
      - 'quiet-solitaire/index.html'
      - 'quiet-solitaire/manifest.webmanifest'
      - 'quiet-solitaire/service-worker.js'
      - 'quiet-solitaire/public/**'
      - 'quiet-solitaire/src/**'
      - 'quiet-solitaire/tests/**'
      - 'quiet-solitaire/scripts/**'
      - 'quiet-solitaire/android/**'
      - 'quiet-solitaire/build-android.sh'
      - '.github/workflows/quiet-solitaire-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quiet-solitaire
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Test PWA
        run: npm test

      - name: Browser gameplay smoke
        run: |
          npm run build
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          node scripts/browser-smoke.mjs

      - name: Build and verify APK
        run: |
          set -o pipefail
          ANDROID_HOME="$ANDROID_HOME" ./build-android.sh | tee android-build.log

      - name: Android emulator install and resume
        run: bash scripts/emulator-smoke.sh

      - name: Upload verified APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: quiet-solitaire-v1.4.0
          path: |
            quiet-solitaire/Quiet-Solitaire-v1.4.0.apk
            quiet-solitaire/android-build.log
            quiet-solitaire/android-build/apk-badging.txt
            quiet-solitaire/android-build/apk-permissions.txt
            quiet-solitaire/android-build/apk-signature.txt
            quiet-solitaire/android-build/apk-alignment.txt
            quiet-solitaire/browser-smoke.png
            quiet-solitaire/android-build/emulator-qa.txt
            quiet-solitaire/android-build/emulator-launch.png
            quiet-solitaire/android-build/emulator-resume.png
          if-no-files-found: error
