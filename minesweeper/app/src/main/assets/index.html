<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Minesweeper</title><link rel="stylesheet" href="style.css"></head><body class="modern">
<header><div><small>APPFARM · OFFLINE</small><h1>MINESWEEPER</h1></div><button id="restart" class="icon" aria-label="Restart game">↻</button></header>
<section class="dashboard"><button id="difficulty" class="difficulty">BEGINNER ▾</button><div class="counter"><span>⚑ MINES</span><b id="mines">10</b></div><div class="counter"><span>◷ TIME</span><b id="time">000</b></div></section>
<main><div id="boardwrap" aria-label="Game board"><div id="board"></div></div><div class="zoom"><button id="minus" aria-label="Zoom out">−</button><span>ZOOM</span><button id="plus" aria-label="Zoom in">+</button></div><div id="message" aria-live="polite">Tap a tile to begin</div></main>
<footer><div class="modes"><button id="revealMode" class="selected">◉ Reveal</button><button id="flagMode">⚑ Flag</button></div><nav><button id="newgame">↻<span>New game</span></button><button id="statsBtn">▥<span>Statistics</span></button><button id="settingsBtn">⚙<span>Settings</span></button></nav></footer>
<div id="overlay" hidden><section class="sheet" role="dialog" aria-modal="true"><div class="sheethead"><h2 id="panelTitle"></h2><button id="close" aria-label="Close">✕</button></div><div id="panel"></div></section></div>
<script src="engine.js"></script><script src="app.js"></script></body></html>
