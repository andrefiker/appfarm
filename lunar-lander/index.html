<script>

$('sheet').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let a=b.dataset.action;if(b.dataset.mission!=null){reset(Number(b.dataset.mission));mode='brief';showOverlay();}else if(a==='start'||a==='resume')start();else if(a==='retry'){reset();start();}else if(a==='next'){reset(index+1);mode='brief';showOverlay();}else if(a==='missions'){release();mode='missions';showOverlay();}else if(a==='back'){mode=state.result||(state.elapsed===0?'brief':'paused');if(mode==='crash'||mode==='landed'||mode==='brief')showOverlay();else{mode='paused';showOverlay();}}});

const canvas=$('canvas'),ctx=canvas.getContext('2d');let width=0,height=0,dpr=1;new ResizeObserver(()=>{width=canvas.clientWidth;height=canvas.clientHeight;dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=width*dpr;canvas.height=height*dpr;}).observe(canvas);
