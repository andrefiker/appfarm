<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101c1b">
  <meta name="description" content="Play-money Texas Hold'em and Five-Card Draw against bots or friends.">
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <link rel="stylesheet" href="styles.css?v=2">
  <title>Poker Table</title>
</head>
<body>
  <main id="app">
    <header>
      <span class="mark" aria-hidden="true">♠</span>
      <strong>Poker Table</strong>
      <span id="liveLabel" class="live">CHOOSE MODE</span>
      <button id="more" aria-label="Table controls" hidden>☰</button>
    </header>

    <section id="launcher" class="launcher" aria-label="Choose a poker mode">
      <div class="launcher-card">
        <span class="eyebrow">PLAY MONEY · 2–5 SEATS</span>
        <h1>Pick a table</h1>
        <p>Start a fresh game instead of dropping into somebody else’s full table.</p>

        <button id="playBots" class="mode-button primary-mode">
          <span class="mode-icon">♠</span>
          <span><strong>Play vs Bots</strong><small>Fresh 4-player table · starts immediately</small></span>
        </button>

        <button id="createMulti" class="mode-button">
          <span class="mode-icon">↗</span>
          <span><strong>Multiplayer</strong><small>Create a private room and share its link</small></span>
        </button>

        <div class="join-room">
          <label for="roomCode">Join a room</label>
          <div class="join-row">
            <input id="roomCode" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="ROOM CODE" aria-label="Room code">
            <button id="joinRoom">Join</button>
          </div>
        </div>
        <p id="launcherMessage" class="launcher-message" aria-live="polite"></p>
      </div>
    </section>

    <section id="game" hidden>
      <section id="table" aria-live="polite"></section>
      <section id="cards" aria-label="Your cards"></section>
      <p id="status">Connecting…</p>
      <section id="actions" aria-label="Legal actions"></section>
    </section>

    <dialog id="sheet">
      <header>
        <strong>Table controls</strong>
        <button id="closeSheet" aria-label="Close controls">×</button>
      </header>
      <p id="sheetInfo"></p>
      <div id="sheetActions"></div>
      <p class="hint">Rooms are isolated. Share the room link for multiplayer, or add bots when you want to start immediately.</p>
    </dialog>
  </main>
  <script type="module" src="app.js?v=2"></script>
</body>
</html>
