name: Build Psych Refresher APK

on:
  push:
    branches: [ psych-refresher-v1 ]
    paths:
      - 'psych-refresher/**'
      - '.github/workflows/psych-refresher-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run focused behavior tests
        working-directory: psych-refresher
        run: node tests/data.test.js

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Android lint and assemble
        working-directory: psych-refresher
        run: |
          gradle --no-daemon :app:lintDebug :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Psych-Refresher-v1.0.0.apk

      - name: Verify installable APK
        working-directory: psych-refresher
        run: |
          set -o pipefail
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Psych-Refresher-v1.0.0.apk | tee dist/badging.txt
          grep -q "package: name='com.andrefiker.psychrefresher' versionCode='1' versionName='1.0.0'" dist/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Psych-Refresher-v1.0.0.apk
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions dist/Psych-Refresher-v1.0.0.apk | grep -q 'android.permission.INTERNET'; then
            echo 'Unexpected Internet permission in offline app' >&2
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Psych-Refresher-v1.0.0
          path: psych-refresher/dist/Psych-Refresher-v1.0.0.apk
          if-no-files-found: error
