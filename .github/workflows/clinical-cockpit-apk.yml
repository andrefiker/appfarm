name: Clinical Cockpit Android
on:
  pull_request:
    paths: ['clinical-cockpit/**', '!clinical-cockpit/**/*.md', '.github/workflows/clinical-cockpit-apk.yml']
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: clinical-cockpit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Core crypto and document tests
        run: bash scripts/test-core.sh
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build and lint
        run: |
          gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:lintRelease
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/Clinical-Cockpit-v0.2.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" dist/zipalign
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Clinical-Cockpit-v0.2.0-unsigned.apk > dist/badging.txt
          grep -F "name='com.andrefiker.clinicalcockpit' versionCode='2' versionName='0.2.0'" dist/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions dist/Clinical-Cockpit-v0.2.0-unsigned.apk > dist/permissions.txt
          ! grep -q 'uses-permission' dist/permissions.txt
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Offline Android integration QA
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 12
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd clinical-cockpit && bash scripts/android-qa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clinical-cockpit-v0.2.0
          path: |
            clinical-cockpit/dist/
            clinical-cockpit/app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 7
