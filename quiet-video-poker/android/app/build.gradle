plugins {
    id 'com.android.application'
}

android {
    namespace 'com.appfarm.quietvideopoker'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.appfarm.quietvideopoker'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '1.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
