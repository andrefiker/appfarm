<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f3efe4">
<meta name="color-scheme" content="light only">
<title>Ponte Mestra</title>
<style>
:root{
  --paper:#f3efe4; --paper2:#ebe5d4; --grid:#c9dcec; --ink:#1f3a5f; --ink2:#47617f; --ink3:#8496ab;
  --anchor:#e2552d; --ok:#2f9e44; --ok2:#23803a; --warn:#e8a33a; --bad:#d63b2a; --blue:#2c6fd1;
  --bar:#fbf8f0; --line:rgba(31,58,95,.18);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;color-scheme:light}
body{position:fixed;inset:0}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- barras ---------- */
.bar{position:absolute;left:0;right:0;display:flex;align-items:center;gap:6px;background:var(--bar);
  border-color:var(--ink);border-style:solid;border-width:0;z-index:5}
#topbar{top:0;height:calc(52px + var(--sat));padding:var(--sat) calc(8px + var(--sar)) 0 calc(8px + var(--sal));border-bottom-width:2px}
#bottombar{bottom:0;height:calc(68px + var(--sab));padding:0 calc(8px + var(--sar)) var(--sab) calc(8px + var(--sal));border-top-width:2px}
.ib{min-width:44px;height:44px;border:1.5px solid var(--ink);border-radius:10px;background:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;flex:none}
.ib svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:active{transform:translateY(1px);background:var(--paper2)}
.ib.on{background:var(--ink);color:#fff}
.ib.on svg{stroke:#fff}
.ib:disabled{opacity:.35}
#topbar .ib#tUndo,#topbar .ib#tRedo{min-width:44px}
#lvTitle{flex:1 1 auto;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
#lvTitle small{font-weight:500;color:var(--ink2)}
#budget{flex:0 1 280px;min-width:130px;display:flex;flex-direction:column;gap:3px}
#budget .track{height:12px;border:1.5px solid var(--ink);border-radius:7px;background:#fff;overflow:hidden;position:relative}
#budget .fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .15s,background .15s}
#budget .txt{font-size:12px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
#budget.over .fill{background:var(--bad)} #budget.over .txt{color:var(--bad)}
#budget.near .fill{background:var(--warn)}

#tools{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
#mats{display:flex;gap:4px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent);padding-right:14px!important;overflow-x:auto;overflow-y:hidden;flex:1 1 auto;min-width:0;padding:2px 0;touch-action:pan-x;scrollbar-width:none}
#mats::-webkit-scrollbar{display:none}
.mat{flex:none;width:52px;height:56px;border:1.5px solid var(--ink);border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:700;padding:0}
.mat .sw{width:30px;height:8px;border-radius:4px;border:1px solid rgba(0,0,0,.25)}
.mat.on{background:var(--ink);color:#fff;box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.mat .cost{font-weight:500;font-size:9.5px;opacity:.8}
.sep{width:1.5px;align-self:stretch;margin:8px 2px;background:var(--line);flex:none}
.tbtn{flex:none;width:48px;height:56px;border:1.5px solid var(--ink);border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700;padding:0}
.tbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tbtn.on{background:var(--ink);color:#fff}
.tbtn:disabled{opacity:.35}
.tbtn:active,.mat:active{transform:translateY(1px)}
#btnTest,#btnEdit{flex:none;height:56px;min-width:104px;border:2px solid var(--ok2);border-radius:12px;background:var(--ok);color:#fff;font-weight:900;font-size:19px;letter-spacing:1px;box-shadow:0 3px 0 var(--ok2)}
#btnTest:active,#btnEdit:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ok2)}
#btnEdit{background:#fff;color:var(--ink);border-color:var(--ink);box-shadow:0 3px 0 var(--ink);font-size:15px}
#bottombar.lefty{flex-direction:row-reverse}
#bottombar.lefty #tools{flex-direction:row-reverse}
#testTools{display:flex;gap:6px;align-items:center;flex:1;min-width:0}
#clock{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;min-width:70px;text-align:center}

/* ---------- chips/overlays ---------- */
#chips{position:absolute;left:calc(10px + var(--sal));top:calc(60px + var(--sat));display:flex;flex-wrap:wrap;gap:6px;max-width:70%;z-index:4;pointer-events:none}
.chip{background:rgba(251,248,240,.92);border:1.5px solid var(--ink);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.red{border-color:var(--bad);color:var(--bad)} .chip.ok{border-color:var(--ok2);color:var(--ok2)} .chip.amber{border-color:#b97a12;color:#8a5a08}
#selbar{position:absolute;right:calc(10px + var(--sar));top:calc(60px + var(--sat));display:flex;gap:6px;z-index:6;background:rgba(251,248,240,.95);border:1.5px solid var(--ink);border-radius:12px;padding:5px}
#toast{position:absolute;left:50%;top:calc(64px + var(--sat));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px;z-index:20;pointer-events:none;opacity:0;transition:opacity .2s;max-width:80%;text-align:center}
#toast.show{opacity:1}
#hint{position:absolute;right:calc(10px + var(--sar));top:calc(60px + var(--sat));max-width:min(440px,52%);background:#fffdf7;border:2px solid var(--ink);border-radius:14px;padding:12px 16px 12px 16px;z-index:7;box-shadow:4px 4px 0 rgba(31,58,95,.18);font-size:14.5px;line-height:1.35}
#hint b{display:block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--anchor);margin-bottom:3px}
#hint .x{position:absolute;right:4px;top:4px;width:44px;height:44px;border:0;background:none;font-size:20px;color:var(--ink2)}
#rotate{position:fixed;inset:0;background:var(--paper);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px}
#rotate svg{width:90px;height:90px;stroke:var(--ink);fill:none;stroke-width:2}
@media (orientation:portrait) and (max-width:700px){ body.playing #rotate{display:flex} }

/* ---------- menu ---------- */
#menu{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;padding:calc(10px + var(--sat)) calc(14px + var(--sar)) calc(10px + var(--sab)) calc(14px + var(--sal));
  background:linear-gradient(var(--paper),var(--paper)) padding-box;}
#menu .head{display:flex;align-items:flex-end;gap:16px;flex:none}
#title{margin:0;font-size:42px;font-weight:900;letter-spacing:1px;line-height:1;color:var(--ink);padding:6px 10px;border:3px solid var(--ink);border-radius:6px;background:#fffdf7;box-shadow:5px 5px 0 var(--anchor);touch-action:manipulation}
#menu .sub{font-size:14px;color:var(--ink2);font-weight:600;margin-bottom:4px}
#menu .head .grow{flex:1}
#worldTabs{display:flex;gap:8px;margin:12px 0 8px;flex:none;overflow-x:auto;touch-action:pan-x}
.wtab{flex:none;min-height:48px;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:4px 14px;text-align:left;line-height:1.15}
.wtab b{display:block;font-size:15px} .wtab span{font-size:11.5px;color:var(--ink2)}
.wtab.on{background:var(--ink);color:#fff} .wtab.on span{color:#cfe0f3}
.wtab.locked{opacity:.45}
#levelGrid{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start;padding:4px 2px 10px}
.lvl{min-height:76px;border:2px solid var(--ink);border-radius:12px;background:#fffdf7;text-align:left;padding:8px 10px;position:relative;display:flex;flex-direction:column;gap:3px}
.lvl .n{font-size:12px;font-weight:800;color:var(--anchor)}
.lvl .nm{font-size:14.5px;font-weight:800;line-height:1.1}
.lvl .st{font-size:15px;letter-spacing:2px;color:#c9a227}
.lvl .st i{font-style:normal;color:#cfc6ad}
.lvl .bc{position:absolute;right:8px;bottom:7px;font-size:11px;color:var(--ink2);font-weight:700}
.lvl.locked{opacity:.4}
.lvl:active{transform:translateY(1px)}
#menu .foot{display:flex;gap:8px;flex:none;align-items:center}
.btn{min-height:46px;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:0 16px;font-weight:800;font-size:15px}
.btn.primary{background:var(--ok);border-color:var(--ok2);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4}
#menu .foot .grow{flex:1}
#totalStars{font-weight:800;color:var(--ink2)}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:30;background:rgba(31,58,95,.32);display:flex;align-items:center;justify-content:center;padding:calc(10px + var(--sat)) 12px calc(10px + var(--sab))}
.card{background:#fffdf7;border:2.5px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 rgba(31,58,95,.25);max-width:min(760px,96vw);max-height:100%;width:100%;display:flex;flex-direction:column;overflow:hidden}
.card h2{margin:0;font-size:22px}
.card .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1.5px solid var(--line)}
.card .hd .grow{flex:1}
.card .bd{padding:12px 16px;overflow:auto;touch-action:pan-y;font-size:14px;line-height:1.4}
.card .ft{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1.5px solid var(--line);flex-wrap:wrap}
.res{display:flex;gap:16px;align-items:stretch}
.res canvas{flex:1 1 58%;min-width:0;width:58%;height:200px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper)}
.res .stats{flex:1 1 42%;display:flex;flex-direction:column;gap:6px}
.stars{font-size:40px;letter-spacing:6px;line-height:1;color:#d4a72c;text-shadow:2px 2px 0 rgba(31,58,95,.25)}
.stars i{font-style:normal;color:#d8d0bb;text-shadow:none}
.stat{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0;font-weight:600}
.stat b{font-variant-numeric:tabular-nums}
.stat.bad b{color:var(--bad)} .stat.good b{color:var(--ok2)}
.legend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2)}
.legend .grad{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,#9bb4cf,#e8a33a,#d63b2a)}
table.mt{border-collapse:collapse;width:100%;font-size:13px}
table.mt td,table.mt th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
table.mt th{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2)}
.sw2{display:inline-block;width:22px;height:8px;border-radius:4px;vertical-align:middle;margin-right:6px;border:1px solid rgba(0,0,0,.25)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;border-bottom:1px dashed var(--line);font-weight:700}
.tog input{width:26px;height:26px;accent-color:var(--ink)}
textarea{width:100%;min-height:150px;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;border:1.5px solid var(--ink);border-radius:8px;padding:8px;background:#fff;color:var(--ink);touch-action:pan-y;-webkit-user-select:text;user-select:text}
input[type=number],input[type=text],select{min-height:40px;border:1.5px solid var(--ink);border-radius:8px;padding:0 8px;font:inherit;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
input[type=number]{width:84px}
label.f{display:flex;flex-direction:column;font-size:11.5px;font-weight:700;gap:2px;color:var(--ink2)}
#editorPanel{position:absolute;right:calc(8px + var(--sar));top:calc(60px + var(--sat));bottom:calc(76px + var(--sab));width:min(330px,45vw);z-index:8;background:#fffdf7;border:2px solid var(--ink);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
#editorPanel .bd{flex:1;overflow:auto;padding:10px;touch-action:pan-y;font-size:13px}
#editorPanel h3{margin:0;padding:8px 10px;border-bottom:1.5px solid var(--line);font-size:15px}
@media (max-height:420px){
  #title{font-size:32px}
  .res canvas{height:160px}
  .stars{font-size:32px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="topbar" class="bar hidden">
  <button class="ib" id="btnBack" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div id="lvTitle"></div>
  <div id="budget"><div class="track"><div class="fill"></div></div><div class="txt"></div></div>

  <button class="ib" id="tRedo" aria-label="Refazer"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
  <button class="ib" id="btnFit" aria-label="Enquadrar"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="ib" id="btnHelp" aria-label="Ajuda"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 015 1c0 1.8-2.5 2-2.5 3.6"/><circle cx="12" cy="17.3" r=".6"/></svg></button>
</div>

<div id="bottombar" class="bar hidden">
  <div id="tools">
    <div id="mats"></div>
    <div class="sep"></div>
    <button class="tbtn" id="tSel" title="Selecionar / mover"><svg viewBox="0 0 24 24"><path d="M5 3l12 8-5 1.5L9.5 18z"/><rect x="13" y="14" width="7" height="7" stroke-dasharray="2 2"/></svg>Selec.</button>
    <button class="tbtn" id="tErase" title="Apagar"><svg viewBox="0 0 24 24"><path d="M4 16l8-8 6 6-5 5H7z"/><path d="M13 19h7"/></svg>Apagar</button>
    <button class="tbtn" id="tMirror" title="Espelho"><svg viewBox="0 0 24 24"><path d="M12 3v18" stroke-dasharray="2 2.5"/><path d="M9 7L4 17h5zM15 7l5 10h-5z"/></svg>Espelho</button>
    <button class="tbtn" id="tStress" title="Preview de tensão"><svg viewBox="0 0 24 24"><path d="M3 17l5-9 4 6 3-4 6 7"/></svg>Tensão</button>
    <button class="tbtn" id="tClear" title="Limpar"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Limpar</button>
  </div>
  <div id="testTools" class="hidden">
    <button class="tbtn" id="tPlay" title="Pausar / continuar"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>Pausa</button>
    <button class="tbtn" id="tSlow" title="Câmera lenta 0,25x"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 13V9M9 2h6"/></svg>0,25x</button>
    <button class="tbtn" id="tRestart" title="Reiniciar teste"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 108-8H8"/><path d="M11 1L8 4l3 3"/></svg>Reinic.</button>
    <button class="tbtn" id="tCam" title="Câmera de tensão"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l2-3h4l2 3"/></svg>Câmera</button>
    <button class="tbtn" id="tStress2" title="Cores de tensão"><svg viewBox="0 0 24 24"><path d="M3 17l5-9 4 6 3-4 6 7"/></svg>Tensão</button>
    <div id="clock">0,0 s</div>
  </div>
  <button id="btnTest">TESTAR</button>
  <button id="btnEdit" class="hidden">EDITAR</button>
</div>

<div id="chips" class="hidden"></div>
<div id="selbar" class="hidden">
  <span id="selCount" class="chip" style="align-self:center">0</span>
  <button class="ib" id="sCopy">Copiar</button>
  <button class="ib" id="sPaste">Colar</button>
  <button class="ib" id="sMirror">Espelhar</button>
  <button class="ib" id="sDel">Apagar</button>
</div>
<div id="hint" class="hidden"><b>Dica</b><span id="hintTxt"></span><button class="x" id="hintX" aria-label="Fechar">×</button></div>
<div id="toast"></div>
<div id="editorPanel" class="hidden"></div>

<section id="menu">
  <div class="head">
    <h1 id="title">PONTE MESTRA</h1>
    <div class="sub">Construa, teste, aprove.<br><span id="totalStars"></span></div>
    <div class="grow"></div>
  </div>
  <div id="worldTabs"></div>
  <div id="levelGrid"></div>
  <div class="foot">
    <button class="btn dark" id="btnSandbox">Sandbox</button>
    <button class="btn" id="btnSettings">Configurações</button>
    <button class="btn" id="btnHelp2">Como jogar</button>
    <div class="grow"></div>
  </div>
</section>

<div id="modal" class="hidden"></div>
<div id="rotate"><svg viewBox="0 0 64 64"><rect x="20" y="6" width="24" height="44" rx="4"/><path d="M8 40a24 24 0 0024 18M52 24A24 24 0 0032 6"/><path d="M26 58l6 0-2-4"/></svg><b>Gire o aparelho</b><span>Ponte Mestra foi feito para jogar na horizontal.</span></div>

<script id="core">
'use strict';
/* =====================================================================
   CONFIG
   Unidades: metros, toneladas (t), quilonewtons (kN), segundos.
   ===================================================================== */
const CFG = {
  G: 9.81,
  DT: 1 / 60,          // passo fixo de simulação (um "tick")
  SUB: 24,             // subpassos por tick (XPBD small-steps)
  GRID: 1,             // grade de encaixe (m)
  WELD_COST: 50,       // R$ por junta soldada
  WELD_K: 900,         // rigidez angular da solda (kN·m/rad)
  WELD_MMAX: 28,       // momento máximo da solda (kN·m) antes de virar pino
  LIP: 0.3,            // extensão de contato nas pontas livres da pista (m)
  START_OFF: 11,       // distância do início do veículo até a margem
  FLAG_OFF: 9,         // distância da bandeira após a margem
  TIME_LIMIT: 90,
  STUCK_T: 9,
  BUILD_MARGIN: 4,
  BUILD_TOP: 15,
  FILTER: 0.08,        // filtro passa-baixa da tensão (por subpasso)
  DAMP_MEMBER: 0.06,
  DAMP_VEH: 0.05,
  WATER_DRAG: 2.5,
  BUOY: 0.09,          // empuxo por metro de barra submersa (t/m)
  MU: 0.95,
  JOINT_MASS: 0.02,
  MIN_LEN: 0.9,
  SETTLE: 0.6          // s de carga gradual da gravidade na estrutura
};
CFG.H = CFG.DT / CFG.SUB;

/* =====================================================================
   MATERIALS
   rho: t/m · EA: kN · maxT/maxC: kN · maxL: m · cost: R$/m
   ===================================================================== */
const MATS = {
  pista:     { name: 'Pista',     color: '#39434e', width: 0.34, rho: 0.12,  EA: 1.2e5, maxT: 110, maxC: 110, maxL: 4,  cost: 120, deck: true },
  madeira:   { name: 'Madeira',   color: '#b07a3a', width: 0.2,  rho: 0.03,  EA: 5e4,   maxT: 55,  maxC: 45,  maxL: 3.2, cost: 55 },
  aco:       { name: 'Aço',       color: '#556f8c', width: 0.2,  rho: 0.06,  EA: 2e5,   maxT: 220, maxC: 190, maxL: 6,  cost: 170 },
  cabo:      { name: 'Cabo',      color: '#2b2b2b', width: 0.07, rho: 0.008, EA: 8e4,   maxT: 160, maxC: 0,   maxL: 16, cost: 30, cable: true },
  aluminio:  { name: 'Alumínio',  color: '#9aa8b5', width: 0.2,  rho: 0.022, EA: 9e4,   maxT: 140, maxC: 120, maxL: 5,  cost: 230 },
  concreto:  { name: 'Concreto',  color: '#8f8b80', width: 0.42, rho: 0.25,  EA: 4e5,   maxT: 30,  maxC: 650, maxL: 5,  cost: 120, concrete: true },
  composito: { name: 'Compósito', color: '#2e6f62', width: 0.2,  rho: 0.028, EA: 2.6e5, maxT: 320, maxC: 280, maxL: 7,  cost: 380 },
  pistao:    { name: 'Pistão',    color: '#d39324', width: 0.26, rho: 0.08,  EA: 2e5,   maxT: 300, maxC: 300, maxL: 5,  cost: 420, piston: true }
};
const MAT_ORDER = ['pista', 'madeira', 'aco', 'cabo', 'aluminio', 'concreto', 'composito', 'pistao'];

/* VEÍCULOS: m (t), L/H (m), r raio da roda, ax eixos (m, relativo ao centro),
   v velocidade (m/s), F força motora total (kN) */
const VEH = {
  carro:    { name: 'Carro',    m: 1.2, L: 3.6, H: 1.35, r: 0.36, ax: [-1.2, 1.25],      v: 9,   F: 6,   col: '#e9b44c' },
  van:      { name: 'Van',      m: 2.4, L: 4.8, H: 2.1,  r: 0.4,  ax: [-1.6, 1.7],       v: 8,   F: 10,  col: '#7fb3d5' },
  onibus:   { name: 'Ônibus',   m: 7,   L: 9,   H: 2.9,  r: 0.5,  ax: [-3.0, 3.0],       v: 7,   F: 22,  col: '#e07b39' },
  caminhao: { name: 'Caminhão', m: 10,  L: 8,   H: 3.0,  r: 0.5,  ax: [-3.0, -1.8, 2.8], v: 5.5, F: 26,  col: '#7d8f4e' },
  moto:     { name: 'Moto',     m: 0.25, L: 1.9, H: 1.15, r: 0.32, ax: [-0.7, 0.72],     v: 13,  F: 4,   col: '#c0392b' }
};

/* =====================================================================
   LEVELS (helpers; os dados JSON ficam em <script id="levels-data">)
   ===================================================================== */
const LEVELS = ((typeof document !== 'undefined')
  ? JSON.parse(document.getElementById('levels-data').textContent)
  : globalThis.__LEVELS).map(l => normLevel(l));
const WORLDS = [
  { id: 1, name: 'Interior', sub: 'Madeira e o básico' },
  { id: 2, name: 'Rio', sub: 'Cabos e pontes suspensas' },
  { id: 3, name: 'Represa', sub: 'Água, cheias e tremores' },
  { id: 4, name: 'Porto', sub: 'Básculas, pistões e barcos' }
];
const SANDBOX = normLevel({
  id: 0, w: 0, name: 'Sandbox', hint: 'Modo livre: orçamento ilimitado e todos os materiais.',
  W: 30, hl: 0, hr: 0, floor: -10,
  anchors: [[0, 0], [30, 0], [0, -4], [30, -4], [0, 9], [30, 9], [10, -10], [20, -10]],
  rocks: [], water: { y: -6 }, veh: [{ t: 'carro', at: 0 }, { t: 'caminhao', at: 2.5 }],
  mat: MAT_ORDER.slice(), budget: 0, ev: {}, sandbox: true
});

function levelById(id) {
  if (id === 0) return SANDBOX;
  return LEVELS.find(l => l.id === id) || null;
}
function normLevel(lv) {
  // garante campos padrão (usado também pelo editor)
  const d = Object.assign({ hl: 0, hr: 0, floor: -8, rocks: [], water: null, ev: {}, mat: ['pista', 'madeira'], budget: 5000, veh: [{ t: 'carro', at: 0 }], hint: '' }, lv);
  d.ev = Object.assign({}, d.ev);
  d.veh = d.veh.slice().sort((a, b) => (a.at || 0) - (b.at || 0));
  return d;
}
function levelAnchors(lv) {
  return lv.anchors.map((p, i) => ({ id: 'a' + i, x: p[0], y: p[1], anchor: true }));
}
function heaviestVehicle(lv) {
  let best = null;
  for (const v of lv.veh) { const T = VEH[v.t]; if (T && (!best || T.m > best.m)) best = T; }
  return best || VEH.carro;
}
function vehicleLabel(lv) {
  const names = [];
  for (const v of lv.veh) { const n = VEH[v.t].name; if (!names.includes(n)) names.push(n); }
  return names.join(' + ');
}
function inSolid(lv, x, y) {
  const e = 1e-6;
  if (x < -e && y < lv.hl - e) return true;
  if (x > lv.W + e && y < lv.hr - e) return true;
  if (y < lv.floor - e) return true;
  for (const r of lv.rocks || []) {
    if (x > r.x - r.w / 2 + e && x < r.x + r.w / 2 - e && y < r.top - e) return true;
  }
  return false;
}
function buildBounds(lv) {
  return { x0: -CFG.BUILD_MARGIN, x1: lv.W + CFG.BUILD_MARGIN, y0: lv.floor, y1: Math.max(lv.hl, lv.hr) + CFG.BUILD_TOP };
}

/* ---------- Modelo da ponte (compartilhado por UI, física e testes) ---------- */
function newBridge() { return { joints: [], members: [], weld: {}, next: 1 }; }
function cloneBridge(b) { return JSON.parse(JSON.stringify(b)); }
function nodeMap(lv, br) {
  const m = new Map();
  for (const a of levelAnchors(lv)) m.set(a.id, a);
  for (const j of br.joints) m.set(j.id, j);
  return m;
}
function memberLen(nm, mb) {
  const a = nm.get(mb.a), b = nm.get(mb.b);
  return Math.hypot(b.x - a.x, b.y - a.y);
}
function bridgeCost(lv, br) {
  const nm = nodeMap(lv, br);

function drawHeatmap(c, S) {
  const g = c.getContext('2d'), lv = G.lv, br = G.br, nm = nodeMap(lv, br);
  const peaks = memberPeaks(S);
  let x0 = 0, x1 = lv.W, y0 = Math.min(lv.hl, lv.hr), y1 = Math.max(lv.hl, lv.hr);
  for (const n of nm.values()) { x0 = Math.min(x0, n.x); x1 = Math.max(x1, n.x); y0 = Math.min(y0, n.y); y1 = Math.max(y1, n.y); }
  x0 -= 2; x1 += 2; y0 -= 1.5; y1 += 1.5;
  const W = c.width, H = c.height, s = Math.min(W / (x1 - x0), H / (y1 - y0));
  const ox = (W - (x1 - x0) * s) / 2, oy = (H - (y1 - y0) * s) / 2;
  const X = x => ox + (x - x0) * s, Y = y => H - oy - (y - y0) * s;
  g.fillStyle = '#f3efe4'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#d9e6f1'; g.lineWidth = 1;
  for (let x = Math.ceil(x0); x <= x1; x++) { g.beginPath(); g.moveTo(X(x), 0); g.lineTo(X(x), H); g.stroke(); }
  for (let y = Math.ceil(y0); y <= y1; y++) { g.beginPath(); g.moveTo(0, Y(y)); g.lineTo(W, Y(y)); g.stroke(); }
  g.fillStyle = 'rgba(31,58,95,.18)';
  g.fillRect(0, Y(lv.hl), X(0), H); g.fillRect(X(lv.W), Y(lv.hr), W, H);
  g.lineCap = 'round';
  for (const m of br.members) {
    const a = nm.get(m.a), b = nm.get(m.b), p = peaks[m.id] || { peak: 0 };
    const w = Math.max(3, MATS[m.m].width * s * 0.9);
    g.strokeStyle = '#1f3a5f'; g.lineWidth = w + 2; g.setLineDash(p.broken ? [5, 4] : []);
    g.beginPath(); g.moveTo(X(a.x), Y(a.y)); g.lineTo(X(b.x), Y(b.y)); g.stroke();
    g.strokeStyle = heatColor(p.peak); g.lineWidth = w;
    g.beginPath(); g.moveTo(X(a.x), Y(a.y)); g.lineTo(X(b.x), Y(b.y)); g.stroke();
  }
  g.setLineDash([]);
  for (const a of levelAnchors(lv)) { g.fillStyle = '#e2552d'; g.beginPath(); g.arc(X(a.x), Y(a.y), 5, 0, Math.PI * 2); g.fill(); }
}

const ptrs = new Map();
let act = null; // ação corrente de um dedo
let pinch = null;
let lpTimer = 0;
const HIT_NODE = 24, HIT_MEM = 14;
function screenNode(sx, sy, skipId) {
  let best = null, bd = HIT_NODE;
  for (const n of nodeMap(G.lv, G.br).values()) {
    if (n.id === skipId) continue;
    const d = Math.hypot(wx2sx(n.x) - sx, wy2sy(n.y) - sy);
    if (d < bd) { bd = d; best = n; }
  }
  return best;
}
function screenMember(sx, sy) {
  const nm = nodeMap(G.lv, G.br); let best = null, bd = HIT_MEM;
  for (const m of G.br.members) {
    const a = nm.get(m.a), b = nm.get(m.b);
    const ax = wx2sx(a.x), ay = wy2sy(a.y), bx = wx2sx(b.x), by = wy2sy(b.y);
    const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy || 1;
    let t = ((sx - ax) * dx + (sy - ay) * dy) / L2; t = Math.max(0, Math.min(1, t));
    const d = Math.hypot(ax + dx * t - sx, ay + dy * t - sy);
    if (d < bd) { bd = d; best = m; }
  }
  return best;
}
const snapG = v => Math.round(v / CFG.GRID) * CFG.GRID;
function endTarget(from, sx, sy, mat) {
  const M = MATS[mat];
  const n = screenNode(sx, sy, from.id);
  if (n) return { x: n.x, y: n.y, id: n.id, anchor: n.anchor };
  let wx = sx2wx(sx), wy = sy2wy(sy);
  const dx = wx - from.x, dy = wy - from.y, L = Math.hypot(dx, dy);
  if (L > M.maxL) { wx = from.x + dx / L * M.maxL; wy = from.y + dy / L * M.maxL; }
  let gx = snapG(wx), gy = snapG(wy);
  if (Math.hypot(gx - from.x, gy - from.y) > M.maxL + 1e-6) {
    let best = null, bd = 1e9;
    for (let ix = -2; ix <= 2; ix++) for (let iy = -2; iy <= 2; iy++) {
      const px = snapG(wx) + ix * CFG.GRID, py = snapG(wy) + iy * CFG.GRID;
      if (Math.hypot(px - from.x, py - from.y) > M.maxL + 1e-6) continue;
      const d = Math.hypot(px - wx, py - wy); if (d < bd) { bd = d; best = [px, py]; }
    }
    if (best) { gx = best[0]; gy = best[1]; }
  }
  const ex = findNodeAt(G.lv, G.br, gx, gy, 0.01);
  if (ex) return { x: ex.x, y: ex.y, id: ex.id, anchor: ex.anchor };
  return { x: gx, y: gy };
}
const mirrorX = x => G.lv.W - x;
function mirrorPoint(P) {
  const x = mirrorX(P.x), y = P.y;
  const n = findNodeAt(G.lv, G.br, x, y, 0.01);
  return n ? { x: n.x, y: n.y, id: n.id, anchor: n.anchor } : { x, y };
}
function updateGhost(sx, sy) {
  const from = act.from, mat = G.tool;
  const to = endTarget(from, sx, sy, mat);
  const v = validateMember(G.lv, G.br, from, to, mat);
  G.ghost = { a: from, b: to, mat, ok: v.ok, why: v.why };
  if (G.mirror) {

  }

}
function buildMember(from, to, mat) {

  commit();
  addMember(G.lv, G.br, from, to, mat);

    const ma = mirrorPoint(from), mb = mirrorPoint(to);
    if (!(Math.abs(ma.x - from.x) < 1e-6 && Math.abs(mb.x - to.x) < 1e-6) && !(Math.abs(ma.x - to.x) < 1e-6 && Math.abs(mb.x - from.x) < 1e-6 && Math.abs(ma.y - to.y) < 1e-6)) {
      // recalcula ids após o primeiro membro criar juntas
      const A = findNodeAt(G.lv, G.br, ma.x, ma.y, 0.01) || ma, B = findNodeAt(G.lv, G.br, mb.x, mb.y, 0.01) || mb;
      addMember(G.lv, G.br, A, B, mat);

}
function toggleWeld(n) {

  Audio.weld(); vibe([15, 30, 15]);

}
function moveValid(off) {
  const lv = G.lv, br = G.br, nm = nodeMap(lv, br);

  const bb = buildBounds(lv);

    if (inSolid(lv, p.x, p.y) || p.x < bb.x0 || p.x > bb.x1 || p.y < bb.y0 || p.y > bb.y1) return false;

}

  for (const m of ms) for (const id of [m.a, m.b]) if (!seen.has(id)) { seen.add(id); const n = nm.get(id); joints.push({ id, x: n.x, y: n.y, weld: !!br.weld[id] }); }

}

  const clip = transform ? transform.clip : G.clip; if (!clip || !clip.members.length) return;

function onDown(e) {
  e.preventDefault();
  Audio.unlock();
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t0: performance.now() });
  if (ptrs.size === 2) {
    cancelAction();
    const [a, b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, s: G.cam.s, cx: G.cam.x, cy: G.cam.y };
    pinch.wx = sx2wx(pinch.mx); pinch.wy = sy2wy(pinch.my);
    G.userCam = true; G.stressCam = false; if (G.mode === 'test') updateTestButtons();
    return;
  }
  if (ptrs.size > 2) return;
  const sx = e.clientX, sy = e.clientY;
  if (G.screen !== 'game' || !G.lv) return;
  if (G.mode === 'test') { act = { type: 'pan', lx: sx, ly: sy }; return; }
  if (!$('hint').classList.contains('hidden')) $('hint').classList.add('hidden');
  if (G.editor) { act = { type: 'editor', lx: sx, ly: sy }; return; }
  const node = screenNode(sx, sy);
  clearTimeout(lpTimer);
  if (node) lpTimer = setTimeout(() => { if (act && !act.moved) { act = null; G.ghost = null; G.moving = null; toggleWeld(node); } }, 520);
  if (G.tool === 'erase') { act = { type: 'erase', lx: sx, ly: sy }; return; }
  if (G.tool === 'select') {
    if (node && !node.anchor) {
      if (!G.sel.has(node.id)) { G.sel.clear(); G.sel.add(node.id); }
      act = { type: 'move', sx, sy, node }; G.moving = { off: { x: 0, y: 0 }, invalid: false }; updateSelBar(); G.dirty = true;
    } else act = { type: 'box', sx, sy, lx: sx, ly: sy, node };
    return;
  }
  // material
  if (node) { act = { type: 'build', from: node, sx, sy }; }
  else act = { type: 'pan', lx: sx, ly: sy, tap: true };
}
function onMove(e) {
  const p = ptrs.get(e.pointerId); if (!p) return;
  e.preventDefault();
  p.x = e.clientX; p.y = e.clientY;
  if (pinch && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    G.cam.s = Math.max(4, Math.min(160, pinch.s * d / Math.max(10, pinch.d)));
    // mantém o ponto do mundo sob o centro da pinça
    G.cam.x = pinch.wx - (mx - VW / 2) / G.cam.s;
    G.cam.y = pinch.wy + (my - VH / 2) / G.cam.s;
    G.dirty = true; return;
  }
  if (!act) return;
  const sx = e.clientX, sy = e.clientY;
  const dist = Math.hypot(sx - p.x0, sy - p.y0);
  if (dist > 8) { act.moved = true; clearTimeout(lpTimer); }
  switch (act.type) {
    case 'pan': G.cam.x -= (sx - act.lx) / G.cam.s; G.cam.y += (sy - act.ly) / G.cam.s; act.lx = sx; act.ly = sy; G.userCam = true; G.stressCam = false; G.dirty = true; break;
    case 'build': if (act.moved) updateGhost(sx, sy); break;
    case 'erase': if (act.moved) eraseAt(sx, sy, false, act); break;
    case 'move': {
      const off = { x: snapG(sx2wx(sx) - sx2wx(act.sx)), y: snapG(sy2wy(sy) - sy2wy(act.sy)) };
      G.moving = { off, invalid: !moveValid(off) }; G.dirty = true; break;
    }
    case 'box': if (act.moved) { G.box = { x0: act.sx, y0: act.sy, x1: sx, y1: sy }; G.dirty = true; } break;
    case 'editor': if (act.moved) { G.cam.x -= (sx - act.lx) / G.cam.s; G.cam.y += (sy - act.ly) / G.cam.s; G.dirty = true; } act.lx = sx; act.ly = sy; break;
  }
}
function onUp(e) {
  const p = ptrs.get(e.pointerId);
  ptrs.delete(e.pointerId);
  clearTimeout(lpTimer);
  if (pinch) { if (ptrs.size < 2) pinch = null; act = null; return; }
  if (!act || !p) return;
  const sx = e.clientX, sy = e.clientY, tap = !act.moved && performance.now() - p.t0 < 450;
  const a = act; act = null;
  switch (a.type) {
    case 'build':
      if (tap) {
        if (G.pending && G.pending !== a.from.id) { const from = nodeMap(G.lv, G.br).get(G.pending); G.pending = null; if (from) buildMember(from, { x: a.from.x, y: a.from.y, id: a.from.id, anchor: a.from.anchor }, G.tool); }
        else { G.pending = G.pending === a.from.id ? null : a.from.id; Audio.click(); }
      } else if (G.ghost) { const g = G.ghost; G.ghost = null; if (g.ok) buildMember(g.a, g.b, g.mat); else { if (g.why) toast(g.why); Audio.bad(); } }
      G.ghost = null; break;
    case 'pan':
      if (tap && a.tap && G.pending && G.mode === 'build') {
        const from = nodeMap(G.lv, G.br).get(G.pending); G.pending = null;
        if (from) { const to = endTarget(from, sx, sy, G.tool); buildMember(from, to, G.tool); }
      }
      break;
    case 'move':
      if (a.moved && G.moving && !G.moving.invalid && (G.moving.off.x || G.moving.off.y)) applyMove(G.moving.off);
      else if (a.moved && G.moving && G.moving.invalid) { toast('Posição inválida'); Audio.bad(); }
      G.moving = null; break;
    case 'box':
      if (a.moved && G.box) {
        const b = G.box, x0 = Math.min(b.x0, b.x1), x1 = Math.max(b.x0, b.x1), y0 = Math.min(b.y0, b.y1), y1 = Math.max(b.y0, b.y1);
        G.sel.clear();
        for (const j of G.br.joints) { const X = wx2sx(j.x), Y = wy2sy(j.y); if (X >= x0 && X <= x1 && Y >= y0 && Y <= y1) G.sel.add(j.id); }
        Audio.click();
      } else if (tap) {
        const m = screenMember(sx, sy);
        if (m && MATS[m.m].piston) { commit(); m.inv = !m.inv; if (!m.inv) delete m.inv; toast(m.inv ? 'Pistão: recolhe ⇣' : 'Pistão: estende ⇡'); Audio.weld(); onBridgeChanged(); }
        else G.sel.clear();
      }
      G.box = null; updateSelBar(); break;
    case 'erase':

function onWheel(e) {
  if (G.screen !== 'game') return;
  e.preventDefault();
  const k = Math.exp(-e.deltaY * 0.0015);
  const wx = sx2wx(e.clientX), wy = sy2wy(e.clientY);
  G.cam.s = Math.max(4, Math.min(160, G.cam.s * k));
  G.cam.x = wx - (e.clientX - VW / 2) / G.cam.s; G.cam.y = wy + (e.clientY - VH / 2) / G.cam.s;
  G.userCam = true; G.dirty = true;
}
function onKey(e) {
  if (G.screen !== 'game' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) doRedo(); else doUndo(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); doRedo(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c' && G.sel.size) copySel();
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v' && G.clip) pasteClip();
  else if (e.key === 'Delete' || e.key === 'Backspace') deleteSel();
  else if (e.key === ' ' && G.mode === 'test') { G.paused = !G.paused; updateTestButtons(); }
  else if (e.key === 'Escape') { if (!$('modal').classList.contains('hidden')) closeModal(); else if (G.mode === 'test') stopTest(); }
}

function levelToJSON(lv) {
  const o = { id: 999, w: lv.w || 1, name: lv.name, hint: lv.hint, W: lv.W, hl: lv.hl, hr: lv.hr, floor: lv.floor, anchors: lv.anchors, rocks: lv.rocks, water: lv.water, veh: lv.veh, mat: lv.mat, ev: lv.ev, budget: lv.budget };
  return JSON.stringify(o);
}
function openEditor(base) {
  const src = base || Store.data.custom || levelById(1);
  const lv = normLevel(JSON.parse(levelToJSON(src)));
  lv.id = 999;
  startLevel(999, lv);
  G.editor = true;
  $('hint').classList.add('hidden');
  $('lvTitle').innerHTML = 'Editor de níveis <small>· toque na grade para pôr/tirar âncoras</small>';
  renderEditorPanel();
}
function renderEditorPanel() {
  const lv = G.lv, p = $('editorPanel');
  p.classList.remove('hidden');
  const opts = ['<option value="">— base —</option>'].concat(LEVELS.map(l => `<option value="${l.id}">${l.id}. ${l.name}</option>`)).join('');
  p.innerHTML = `<h3>Editor</h3><div class="bd">

    <div class="row"><label class="f">Vão W<input type="number" id="edW" value="${lv.W}" min="4" max="60"></label><label class="f">Orçamento<input type="number" id="edB" value="${lv.budget}" step="500"></label></div>
    <div class="row"><label class="f">Margem esq.<input type="number" id="edHl" value="${lv.hl}"></label><label class="f">Margem dir.<input type="number" id="edHr" value="${lv.hr}"></label><label class="f">Fundo<input type="number" id="edF" value="${lv.floor}"></label></div>
    <div class="row"><label class="f">Água (vazio = sem)<input type="number" id="edWa" value="${lv.water ? lv.water.y : ''}"></label></div>
    <div class="row"><button class="btn" id="edApply">Aplicar campos</button></div>
    <label class="f">JSON do nível</label><textarea id="edJson"></textarea>
    <div class="row"><button class="btn" id="edCopy">Exportar (copiar)</button><button class="btn" id="edPaste">Importar (colar)</button></div>
    <div class="row"><button class="btn" id="edLoad">Carregar JSON</button><button class="btn primary" id="edPlay">Jogar nível</button></div>
  </div>`;
  const ta = p.querySelector('#edJson'); ta.value = levelToJSON(lv);
  const num = (id, d) => { const v = parseFloat(p.querySelector(id).value); return Number.isFinite(v) ? v : d; };
  p.querySelector('#edBase').onchange = e => { const id = +e.target.value; if (id) { const b = levelById(id); applyEditorLevel(JSON.parse(levelToJSON(b))); } };
  p.querySelector('#edApply').onclick = () => {

    o.budget = Math.max(0, Math.round(num('#edB', o.budget)));

    applyEditorLevel(o);
  };

  p.querySelector('#edPaste').onclick = () => pasteText(t => { ta.value = t; loadEditorJSON(t); });
  p.querySelector('#edLoad').onclick = () => loadEditorJSON(ta.value);
  p.querySelector('#edPlay').onclick = () => { Store.data.custom = JSON.parse(levelToJSON(G.lv)); Store.save(); const c = Store.data.custom; G.editor = false; $('editorPanel').classList.add('hidden'); startLevel(999, c); };
}
function loadEditorJSON(t) {
  try {
    const o = JSON.parse(t);
    if (!o || typeof o.W !== 'number' || !Array.isArray(o.anchors)) throw new Error('formato');

  } catch (e) { toast('JSON inválido'); Audio.bad(); }
}
function applyEditorLevel(o) {
  o.id = 999;
  const lv = normLevel(o);
  lv.mat = (lv.mat || []).filter(m => MATS[m]); if (!lv.mat.length) lv.mat = MAT_ORDER.slice();

function editorTap(sx, sy) {
  const lv = G.lv, x = snapG(sx2wx(sx)), y = snapG(sy2wy(sy));
  const i = lv.anchors.findIndex(a => Math.hypot(a[0] - x, a[1] - y) < 0.01);

function copyText(t) {
  const fallback = () => {
    try { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); toast(ok ? 'Copiado!' : 'Selecione e copie o texto'); } catch (e) { toast('Selecione e copie o texto'); }
  };
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => toast('Copiado para a área de transferência'), fallback); else fallback(); } catch (e) { fallback(); }
}
function pasteText(cb) {
  try {
    if (navigator.clipboard && navigator.clipboard.readText) { navigator.clipboard.readText().then(t => cb(t), () => toast('Cole o JSON na caixa e toque “Carregar JSON”')); return; }
  } catch (e) { /* segue */ }
  toast('Cole o JSON na caixa e toque “Carregar JSON”');
}

/* =====================================================================
   LOOP PRINCIPAL
   ===================================================================== */
let lastT = performance.now();
G.acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  try {
    if (G.screen === 'game' && G.mode === 'test' && G.S) {
      const S = G.S;
      if (!G.paused) {
        G.acc += dt;
        let n = 0;
        while (G.acc >= CFG.DT && n < 3) { stepWorld(S, G.slow ? CFG.SUB / 4 : CFG.SUB); G.acc -= CFG.DT; n++; }
        if (n === 3) G.acc = 0;
      }
      processSimEvents();
      if (S.maxNow > 0.7 && !G.paused) Audio.creak(Math.min(1, (S.maxNow - 0.7) / 0.3));
      if (G.stressCam && S.hot) {
        const c = S.hot, tx = (c.pa.x + c.pb.x) / 2, ty = (c.pa.y + c.pb.y) / 2;
        G.cam.x += (tx - G.cam.x) * 0.08; G.cam.y += (ty - G.cam.y) * 0.08;
        const ts = Math.max(G.cam.s, 38); G.cam.s += (ts - G.cam.s) * 0.05;
      }
      $('clock').textContent = fmtNum(S.t) + ' s';
      if (S.state !== 'run' && !G.resultShown && S.endT > (S.state === 'win' ? 1.0 : 2.2)) finishTest();
      if ((G.frameN = (G.frameN || 0) + 1) % 6 === 0) updateChips();
      render(dt);
    } else if (G.screen === 'game') {
      render(dt);
    }
  } catch (err) {
    // nunca deixa o loop morrer
    if (!G.loopErr) { G.loopErr = true; setTimeout(() => { G.loopErr = false; }, 3000); if (window.console) console.warn(err); }
  }
  requestAnimationFrame(frame);
}

   BOOT
   ===================================================================== */
function bind() {
  cv.addEventListener('pointerdown', onDown, { passive: false });
  cv.addEventListener('pointermove', onMove, { passive: false });
  cv.addEventListener('pointerup', onUp);
  cv.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); pinch = null; cancelAction(); });
  cv.addEventListener('wheel', onWheel, { passive: false });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  // bloqueia rolagem/zoom da página fora das áreas roláveis
  document.addEventListener('touchmove', e => { if (!e.target.closest('#levelGrid,#mats,#worldTabs,.bd,textarea')) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.mode === 'test') { G.paused = true; updateTestButtons(); } });
  document.addEventListener('pointerdown', () => Audio.unlock(), { capture: true });

  $('btnBack').onclick = () => { Audio.click(); if (G.mode === 'test') stopTest(); else goMenu(); };
  $('btnFit').onclick = () => { Audio.click(); fitView(); };
  $('btnHelp').onclick = () => { Audio.click(); showHelp(); };
  $('btnHelp2').onclick = () => { Audio.click(); showHelp(); };
  $('btnSettings').onclick = () => { Audio.click(); showSettings(); };
  $('btnSandbox').onclick = () => { Audio.click(); startLevel(0); };
  $('hintX').onclick = () => $('hint').classList.add('hidden');
  $('hint').onclick = () => $('hint').classList.add('hidden');
  $('tSel').onclick = () => { Audio.click(); setTool(G.tool === 'select' ? (G.lv.mat[0]) : 'select'); };
  $('tErase').onclick = () => { Audio.click(); setTool(G.tool === 'erase' ? (G.lv.mat[0]) : 'erase'); };
  $('tMirror').onclick = () => { G.mirror = !G.mirror; $('tMirror').classList.toggle('on', G.mirror); Audio.click(); toast(G.mirror ? `Espelho: simetria em x = ${fmtNum(G.lv.W / 2)} m` : 'Espelho desligado'); updateChips(); };
  const togStress = () => { G.stressView = !G.stressView; S_().stress = G.stressView; Store.save(); $('tStress').classList.toggle('on', G.stressView); $('tStress2').classList.toggle('on', G.stressView); Audio.click(); updateChips(); G.dirty = true; };
  $('tStress').onclick = togStress; $('tStress2').onclick = togStress;
  $('tUndo').onclick = doUndo; $('tRedo').onclick = doRedo; $('tClear').onclick = doClear;
  $('btnTest').onclick = startTest;
  $('btnEdit').onclick = () => { Audio.click(); stopTest(); };
  $('tPlay').onclick = () => { G.paused = !G.paused; Audio.click(); updateTestButtons(); updateChips(); };
  $('tSlow').onclick = () => { G.slow = !G.slow; Audio.click(); updateTestButtons(); updateChips(); };
  $('tRestart').onclick = () => { Audio.click(); restartTest(); };
  $('tCam').onclick = () => { G.stressCam = !G.stressCam; if (!G.stressCam) fitView(); Audio.click(); updateTestButtons(); updateChips(); };
  $('sCopy').onclick = copySel; $('sPaste').onclick = () => pasteClip(); $('sMirror').onclick = mirrorSel; $('sDel').onclick = deleteSel;
  // segurar o título abre o editor oculto
  let titleT = 0;
  const title = $('title');
  title.addEventListener('pointerdown', () => { clearTimeout(titleT); titleT = setTimeout(() => { vibe(40); Audio.weld(); openEditor(); }, 900); });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) title.addEventListener(ev, () => clearTimeout(titleT));
  title.addEventListener('contextmenu', e => e.preventDefault());
}
bind();
resize();
renderMenu();
showScreen('menu');
requestAnimationFrame(frame);
// para testes automatizados
window.__PM = { G, startLevel, startTest, stopTest, openEditor, goMenu, Store };
})();

</script>
</body>
