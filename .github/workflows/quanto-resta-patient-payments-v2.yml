name: Build Loot Patient Payments
on:
  push:
    branches: [ quanto-resta-patient-payments-v2 ]
    paths:
      - 'quanto-resta-patient-payments-v2/**'
      - '.github/workflows/quanto-resta-patient-payments-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quanto-resta-patient-payments-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android API 35
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit test, lint and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Inspect APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 7
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -E 'READ_CONTACTS|READ_SMS|ACCESS_FINE_LOCATION'; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Loot-Patient-Payments-debug-APK
          path: quanto-resta-patient-payments-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  device_qa:
    needs: android
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle -p quanto-resta-patient-payments-v2 --no-daemon :app:connectedDebugAndroidTest && adb pull /sdcard/Android/data/com.andrefiker.lootpayments/files/patient-screen-actual.png quanto-resta-patient-payments-v2/patient-screen-actual.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Loot-actual-screen
          path: quanto-resta-patient-payments-v2/patient-screen-actual.png
          if-no-files-found: ignore
