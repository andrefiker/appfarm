name: Quiet Knight series candidate
on:
  push:
    branches: [codex/quiet-knight-series-candidate-20261104]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: qk_test
          POSTGRES_DB: qk_test
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U postgres -d qk_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports: [16379:6379]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Build candidate
        run: docker build -t quiet-knight-series ./quiet-knight-server
      - name: Verify server and independent clients
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://postgres:qk_test@127.0.0.1:5432/qk_test \
            -e REDIS_URL=redis://127.0.0.1:16379 \
            quiet-knight-series node predeploy.js
