<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#111315">
  <title>Daily Training</title>
  <link rel="stylesheet" href="training.css">
</head>
<body>
  <main class="page">
    <header class="topline" aria-label="Selected training day">
      <button id="previous" class="date-arrow" type="button" aria-label="Previous day">‹</button>
      <div class="date-stack"><div id="date" class="date-label"></div><button id="today" class="today-link" type="button" hidden>Today</button></div>
      <div id="count" class="day-count" aria-live="polite">0/9</div>
      <button id="next" class="date-arrow" type="button" aria-label="Next day">›</button>
      <button id="more" class="more-button" type="button" aria-label="More options">⋮</button>
    </header>
    <p id="baseline-note" class="baseline-note" hidden>First pass — do what you can. These numbers become your starting point.</p>
    <div class="list" id="exercise-list" aria-label="Exercises"></div>
    <footer class="bottom">
      <span id="save-status" class="save-status" aria-live="polite"></span>
      <button id="finish" class="finish-button" type="button">FINISH</button>
      <button id="edit-results" class="footer-link" type="button" hidden>Edit results</button>
      <button id="done-edit" class="finish-button" type="button" hidden>DONE</button>
    </footer>
  </main>

  <section id="menu" class="sheet" hidden aria-labelledby="menu-title">
    <div class="sheet-panel menu-panel">
      <div class="sheet-heading"><h1 id="menu-title">More</h1><button id="close-menu" class="icon-button" type="button" aria-label="Close">×</button></div>
      <button id="open-manager" class="menu-item" type="button">Manage exercises <span aria-hidden="true">›</span></button>
    </div>
  </section>
  <section id="manager" class="sheet" hidden aria-labelledby="manager-title">
    <div class="sheet-panel">
      <div class="sheet-heading"><div><h1 id="manager-title">Exercises</h1><p>Change the list you log.</p></div><button id="close-manager" class="icon-button" type="button" aria-label="Close">×</button></div>
      <div id="manager-active" class="manager-list"></div>
      <button id="add-exercise" class="add-button" type="button">＋ Add exercise</button>
      <div id="removed-wrap" class="removed-wrap" hidden><div class="section-label">Removed</div><div id="manager-removed" class="manager-list"></div></div>
    </div>
  </section>
  <section id="editor" class="sheet" hidden aria-labelledby="editor-title">
    <form id="exercise-form" class="sheet-panel editor-panel">
      <div class="sheet-heading"><div><h1 id="editor-title">Add exercise</h1><p>Set the name and how you record it.</p></div><button id="cancel-editor-x" class="icon-button" type="button" aria-label="Close">×</button></div>
      <label class="field-label" for="exercise-name">Name</label><input id="exercise-name" class="text-field" maxlength="40" required autocomplete="off">
      <div class="field-pair">
        <label class="field-label">Unit<select id="exercise-unit" class="select-field"><option value="reps">Reps</option><option value="sec">Seconds</option></select></label>
        <label class="field-label">Count each<select id="exercise-side" class="select-field"><option value="none">Once</option><option value="leg">Per leg</option><option value="side">Per side</option></select></label>
      </div>
      <p id="editor-error" class="editor-error" aria-live="polite"></p>
      <div class="form-actions"><button id="cancel-editor" class="text-button" type="button">Cancel</button><button class="finish-button" type="submit">SAVE</button></div>
    </form>
  </section>

  <script src="training.js"></script>
  <script>
    (function () {
      const bridge = window.LocalLedger;
      const storage = bridge ? {
        load: () => bridge.load(), save: value => bridge.save(value)
      } : {
        load: () => localStorage.getItem('daily-training-ledger') || '',
        save: value => localStorage.setItem('daily-training-ledger', value)
      };
      const model = new TrainingModel.TrainingModel(storage);
      const $ = id => document.getElementById(id);
      const list = $('exercise-list'), status = $('save-status');
      let editingId = null;

      function formatDate(key) {
        const [year, month, day] = key.split('-').map(Number);
        return new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'short', day: 'numeric' })
          .format(new Date(year, month - 1, day, 12));
      }
      function haptic(kind) {
        try { if (bridge && typeof bridge[kind] === 'function') bridge[kind](); }
        catch (_) {}
      }
      function suffix(ex) {
        return ex.side === 'leg' ? ' / leg' : ex.side === 'side' ? ' sec / side' : ex.unit === 'sec' ? ' sec' : '';
      }
      function feedbackText(day, ex) {
        const actual = day.actual[ex.id], goal = day.target[ex.id];
        if (day.completed) {
          return Number.isSafeInteger(actual) ? `Done ${actual}${suffix(ex)} · Next ${actual + 1}${suffix(ex)}` : 'Not logged';
        }
        if (!Number.isSafeInteger(actual)) return '';
        if (!Number.isSafeInteger(goal)) return `Baseline ${actual}${suffix(ex)}`;
        if (actual < goal) return '';
        return `✓ ${actual}${suffix(ex)}${actual > goal ? ` · +${actual - goal}` : ''}`;
      }
      function updateBottom(day) {
        const entered = model.completedCount(model.selectedDate), total = model.getExercises().length;
        $('count').textContent = `${entered}/${total}`;
        $('count').setAttribute('aria-label', `${entered} of ${total} exercises entered`);
        $('finish').hidden = day.completed;
        $('edit-results').hidden = !day.locked;
        $('done-edit').hidden = !day.editing;
        status.textContent = day.editing ? 'Editing results' : day.completed ? 'Workout complete ✓' : `${entered} / ${total} entered`;
        status.className = `save-status ${day.completed ? 'saved' : ''}`;
      }
      function updateRow(row, input, check, feedback, ex, day) {
        const actual = day.actual[ex.id], goal = day.target[ex.id];
        const met = Number.isSafeInteger(goal) && Number.isSafeInteger(actual) && actual >= goal;
        row.classList.toggle('is-recorded', Number.isSafeInteger(actual));
        row.classList.toggle('is-complete', met);
        row.classList.toggle('is-above', met && actual > goal);
        check.textContent = met ? '✓' : '';
        feedback.textContent = feedbackText(day, ex);
        input.setAttribute('aria-valuenow', actual == null ? '' : String(actual));
      }
      function render() {
        const date = model.selectedDate, day = model.getDay(date), exercises = model.getExercises();
        $('date').textContent = formatDate(date);
        $('next').disabled = date >= model.today;
        $('today').hidden = date === model.today;
        $('baseline-note').hidden = day.completed || !day.baseline;
        list.replaceChildren();
        for (const currentEx of exercises) {
          const ex = day.completed && day.exerciseMeta[currentEx.id]
            ? { ...currentEx, ...day.exerciseMeta[currentEx.id] } : currentEx;
          const goal = day.target[ex.id], last = day.lastActual[ex.id], value = day.actual[ex.id];
          const row = document.createElement('section'); row.className = 'exercise';
          const info = document.createElement('div'); info.className = 'exercise-info';
          const name = document.createElement('div'); name.className = 'exercise-name'; name.textContent = ex.name;
          const target = document.createElement('div'); target.className = 'target-line';
          if (Number.isSafeInteger(goal)) {
            const previous = document.createElement('span'); previous.className = 'previous-value'; previous.textContent = String(last);
            const arrow = document.createElement('span'); arrow.className = 'target-arrow'; arrow.textContent = '→';
            const editable = !day.locked;
            const goalValue = document.createElement(editable ? 'button' : 'span'); goalValue.className = 'goal-value';
            if (editable) {
              goalValue.type = 'button'; goalValue.setAttribute('aria-label', `Log ${ex.name} goal ${goal}${suffix(ex)}`);
              goalValue.setAttribute('title', 'Tap to log goal');
            }
            goalValue.textContent = String(goal);
            const units = document.createElement('span'); units.className = 'target-units'; units.textContent = suffix(ex);
            target.append(previous, arrow, goalValue, units);
            if (editable) goalValue.addEventListener('click', () => change(String(goal), 'goal'));
          } else {
            target.textContent = 'Baseline';
            target.classList.add('baseline-target');
          }
          const feedback = document.createElement('div'); feedback.className = 'feedback';
          info.append(name, target, feedback);

          const controls = document.createElement('div'); controls.className = 'controls';
          const minus = document.createElement('button'); minus.type = 'button'; minus.className = 'stepper'; minus.textContent = '−';
          minus.setAttribute('aria-label', `Decrease ${ex.name}`);
          const input = document.createElement('input'); input.type = 'text'; input.inputMode = 'numeric';
          input.pattern = '[0-9]*'; input.autocomplete = 'off'; input.enterKeyHint = 'done';
          input.setAttribute('aria-label', `${ex.name}, completed ${ex.unit}${suffix(ex)}`);
          input.setAttribute('role', 'spinbutton'); input.value = value == null ? '' : String(value);
          const plus = document.createElement('button'); plus.type = 'button'; plus.className = 'stepper'; plus.textContent = '+';
          plus.setAttribute('aria-label', `Increase ${ex.name}`);
          const check = document.createElement('span'); check.className = 'completion'; check.setAttribute('aria-hidden', 'true');
          controls.append(minus, input, plus, check); row.append(info, controls);
          input.readOnly = day.locked; minus.disabled = day.locked; plus.disabled = day.locked;

          function change(raw, action) {
            const before = model.getDay(date).actual[ex.id];
            if (raw !== '' && !/^\d+$/.test(raw)) { input.value = before == null ? '' : String(before); return; }
            try {
              const current = model.setActual(date, ex.id, raw), actual = current.actual[ex.id];
              input.value = actual == null ? '' : String(actual);
              const crossed = action && Number.isSafeInteger(goal) &&
                (!Number.isSafeInteger(before) || before < goal) && Number.isSafeInteger(actual) && actual >= goal;
              if (crossed) haptic('goal');
              else if (action && before !== actual) haptic('tick');
              if (action && before !== actual) {
                input.classList.remove('value-changed'); void input.offsetWidth; input.classList.add('value-changed');
              }
              updateRow(row, input, check, feedback, ex, current); updateBottom(current);
            } catch (_) { input.value = before == null ? '' : String(before); }
          }
          input.addEventListener('input', () => change(input.value, null));
          minus.addEventListener('click', () => { const next = TrainingModel.adjustActual(input.value, -1); if (next != null) change(String(next), 'step'); });
          plus.addEventListener('click', () => change(String(TrainingModel.adjustActual(input.value, 1)), 'step'));
          updateRow(row, input, check, feedback, ex, day);
          list.append(row);
        }
        updateBottom(day);
      }

      function openManager() { renderManager(); $('menu').hidden = true; $('manager').hidden = false; }
      function renderManager() {
        const active = $('manager-active'), removed = $('manager-removed');
        active.replaceChildren(); removed.replaceChildren();
        for (const ex of model.getExercises()) {
          const row = document.createElement('div'); row.className = 'manage-row';
          const label = document.createElement('span'); label.className = 'manage-name'; label.textContent = ex.name;
          const edit = document.createElement('button'); edit.type = 'button'; edit.className = 'text-button'; edit.textContent = 'Edit';
          edit.addEventListener('click', () => openEditor(ex));
          const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'text-button danger'; remove.textContent = 'Remove';
          remove.addEventListener('click', () => {
            if (remove.dataset.confirm === 'yes') { model.removeExercise(ex.id); render(); renderManager(); }
            else { remove.dataset.confirm = 'yes'; remove.textContent = 'Confirm'; }
          });
          row.append(label, edit, remove); active.append(row);
        }
        for (const ex of model.getRemovedExercises()) {
          const row = document.createElement('div'); row.className = 'manage-row';
          const label = document.createElement('span'); label.className = 'manage-name removed-name'; label.textContent = ex.name;
          const restore = document.createElement('button'); restore.type = 'button'; restore.className = 'text-button'; restore.textContent = 'Restore';
          restore.addEventListener('click', () => { model.restoreExercise(ex.id); render(); renderManager(); });
          row.append(label, restore); removed.append(row);
        }
        $('removed-wrap').hidden = model.getRemovedExercises().length === 0;
      }
      function openEditor(ex) {
        editingId = ex ? ex.id : null;
        $('editor-title').textContent = ex ? 'Edit exercise' : 'Add exercise';
        $('exercise-name').value = ex ? ex.name : '';
        $('exercise-unit').value = ex ? ex.unit : 'reps';
        $('exercise-side').value = ex && ex.side ? ex.side : 'none';
        $('editor-error').textContent = '';
        $('manager').hidden = true; $('editor').hidden = false; $('exercise-name').focus();
      }
      function closeEditor() { $('editor').hidden = true; editingId = null; openManager(); }
      $('previous').addEventListener('click', () => { model.shiftDate(-1); render(); });
      $('next').addEventListener('click', () => { model.shiftDate(1); render(); });
      $('today').addEventListener('click', () => { model.setDate(model.today); render(); });
      $('finish').addEventListener('click', () => { model.finishDay(model.selectedDate); haptic('saved'); render(); });
      $('edit-results').addEventListener('click', () => { model.unlockDay(model.selectedDate); render(); });
      $('done-edit').addEventListener('click', () => { model.finishDay(model.selectedDate); render(); });
      $('more').addEventListener('click', () => { $('menu').hidden = false; });
      $('close-menu').addEventListener('click', () => { $('menu').hidden = true; });
      $('open-manager').addEventListener('click', openManager);
      $('close-manager').addEventListener('click', () => { $('manager').hidden = true; });
      $('add-exercise').addEventListener('click', () => openEditor(null));
      $('cancel-editor').addEventListener('click', closeEditor);
      $('cancel-editor-x').addEventListener('click', closeEditor);
      $('exercise-unit').addEventListener('change', () => {
        if ($('exercise-unit').value !== 'sec' && $('exercise-side').value === 'side') $('exercise-side').value = 'none';
      });
      $('exercise-form').addEventListener('submit', event => {
        event.preventDefault();
        try {
          const detail = { name: $('exercise-name').value, unit: $('exercise-unit').value,
            side: $('exercise-side').value === 'none' ? null : $('exercise-side').value };
          if (editingId) model.editExercise(editingId, detail); else model.addExercise(detail);
          $('editor').hidden = true; editingId = null; render(); openManager();
        } catch (error) { $('editor-error').textContent = error.message; }
      });
      if (typeof document.addEventListener === 'function') {
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden && model.refreshToday(new Date())) render();
        });
      }
      render();
    })();
  </script>
</body>
</html>
