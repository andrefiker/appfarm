<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#13583b" />
    <meta name="description" content="A quiet, single-player Jacks or Better video poker game. Fictional credits only." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Quiet Video Poker</title>
  </head>
  <body>
    <main id="app" class="machine" aria-label="Quiet Video Poker">
      <header class="topbar">
        <div class="brand">Quiet Video Poker</div>
        <div class="scoreboard" aria-live="polite">
          <div class="score"><span>CREDITS</span><strong id="credits">1,000</strong></div>
          <div class="score"><span>BET</span><strong id="bet-value">1</strong></div>
          <div class="score"><span>HANDS</span><strong id="hands-count">0</strong></div>
          <div class="score optional-stat"><span>NET</span><strong id="net-value">0</strong></div>
        </div>
        <div class="bet-controls" aria-label="Bet controls">
          <button class="control-button small" id="bet-minus" type="button" aria-label="Decrease bet">−</button>
          <span class="bet-label">BET</span>
          <button class="control-button small" id="bet-plus" type="button" aria-label="Increase bet">+</button>
          <button class="control-button max" id="max-bet" type="button">MAX</button>
        </div>
      </header>

      <section class="table" aria-label="Poker hand">
        <div class="status-line"><div id="message" class="message" aria-live="polite">Choose your bet, then deal.</div></div>
        <div class="hand-area">
          <div class="cards" id="cards" aria-label="Your cards"></div>
          <div class="hold-row" id="hold-row" aria-label="Card hold indicators"></div>
        </div>
        <div class="table-note">JACKS OR BETTER <span aria-hidden="true">·</span> FICTIONAL CREDITS</div>
      </section>

      <footer class="controls" aria-label="Game controls">
        <button class="control-button primary" id="action-button" type="button">DEAL</button>
        <button class="control-button hint-button" id="hint-button" type="button">HINT</button>
        <div class="secondary-controls">
          <button class="control-button utility" id="paytable-open" type="button" aria-label="Pay table" title="Pay table">PAYS</button>
          <button class="control-button utility" id="settings-open" type="button" aria-label="Settings" title="Settings">⚙</button>
        </div>
      </footer>
    </main>

    <div class="modal-backdrop" id="modal" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-heading"><h2 id="modal-title">PAY TABLE</h2><button class="close-button" id="modal-close" aria-label="Close">×</button></div>
        <div id="modal-content"></div>
      </section>
    </div>
    <div id="toast" class="toast" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
