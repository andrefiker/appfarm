name: Build Quiet Breakout APK
on:
  push:
    paths:
      - 'quiet-breakout/**'
      - '.github/workflows/build-quiet-breakout-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-disabled: true
      - name: Test gameplay and bundle offline assets
        run: |
          cd quiet-breakout
          npm test
          npm run check
          node scripts/build-webview.mjs
          node --check android/app/src/main/assets/bundle.js
          ! grep -R -E 'localhost|127[.]0[.]0[.]1' android/app/src/main/assets
      - name: Build debug APK
        run: cd quiet-breakout/android && gradle --no-daemon :app:assembleDebug
      - name: Verify package, assets, and signature
        run: |
          APK=quiet-breakout/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.andrefiker.quietbreakout' versionCode='1' versionName='1.0.0'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -q "uses-permission"; then echo "Unexpected Android permission in offline game APK"; exit 1; fi
          unzip -l "$APK" | grep -E "assets/(index.html|bundle.js|manifest.webmanifest)"
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-breakout-1.0.0-apk
          path: quiet-breakout/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
