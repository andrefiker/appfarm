name: Quiet Knight Animal Kingdom APK

on:
  push:
    branches: [ feature/quiet-knight-animal-kingdom ]
    paths:
      - 'quiet-knight-server/frontend/**'
      - 'android-store/**'
      - '.github/workflows/quiet-knight-animal-kingdom.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-quiet-knight:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: qk_test
          POSTGRES_DB: qk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d qk_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quiet-knight-server/frontend/package-lock.json

      - name: Build the static game
        working-directory: quiet-knight-server/frontend
        run: |
          npm ci
          npm run test:animal
          npm run test:account
          npx tsc --noEmit
          npm run build -- --base=./

      - name: Bundle the game into the existing Android app
        run: |
          mkdir -p android-store/app/src/main/assets/quiet-knight
          cp -R quiet-knight-server/frontend/dist/. android-store/app/src/main/assets/quiet-knight/
          test -s android-store/app/src/main/assets/quiet-knight/index.html
          find android-store/app/src/main/assets/quiet-knight -type f | sort

      - name: Test real account HTTP against isolated PostgreSQL and Redis
        working-directory: quiet-knight-server
        env:
          DATABASE_URL: postgresql://postgres:qk_test@127.0.0.1:5432/qk_test
          REDIS_URL: redis://127.0.0.1:6379
          QK_APPLY_IDENTITY_MIGRATIONS: 'true'
        run: |
          npm ci
          npm run test:identity
          npm run test:frontend-delivery
          npm run test:migration-safety
          npm run migrate:identity
          npm run test:auth-http
          mkdir -p public
          cp -R frontend/dist/. public/
          node predeploy.js

      - name: Rendered untimed and legacy-clock acceptance on isolated candidate
        working-directory: quiet-knight-server/frontend-acceptance
        env:
          DATABASE_URL: postgresql://postgres:qk_test@127.0.0.1:5432/qk_test
          REDIS_URL: redis://127.0.0.1:6379
          FRONTEND_ORIGIN: http://127.0.0.1:3000
          QK_FRONTEND_URL: http://127.0.0.1:3000/
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node ../server.js > "$RUNNER_TEMP/quiet-knight-browser-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 0.25
          done
          npx playwright test clock.spec.js

      - name: Upload synthetic rendered QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiet-knight-clock-rendered-qa
          path: quiet-knight-server/frontend-acceptance/output/playwright/*.png
          if-no-files-found: ignore
          retention-days: 1

      - name: Set up Java 17 and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify the runner-provided Android SDK
        run: |
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android 35 build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Assemble signed debug APK
        working-directory: android-store
        run: gradle --no-daemon :app:assembleQuietKnightDebug

      - name: Verify package, signature, permissions, and bundled game assets
        working-directory: android-store
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/quietKnight/debug/app-quietKnight-debug.apk dist/QuietKnight-Animal-Kingdom-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/QuietKnight-Animal-Kingdom-debug.apk | head -n 4
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions dist/QuietKnight-Animal-Kingdom-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/QuietKnight-Animal-Kingdom-debug.apk
          unzip -l dist/QuietKnight-Animal-Kingdom-debug.apk | grep -E 'assets/quiet-knight/(index.html|assets/.*\.(js|css))' | head -n 20
          unzip -l dist/QuietKnight-Animal-Kingdom-debug.apk | grep -q 'assets/quiet-knight/index.html'
          for army in ivory ebony; do
            for piece in king queen bishop knight rook pawn; do
              unzip -Z1 dist/QuietKnight-Animal-Kingdom-debug.apk | grep -Fxq "assets/quiet-knight/animal-kingdom/pieces/${army}-${piece}.png"
            done
          done
          if unzip -p dist/QuietKnight-Animal-Kingdom-debug.apk 'assets/quiet-knight/assets/*.js' | grep -Eq 'https?://(localhost|127\.0\.0\.1)'; then
            echo 'Bundled game must not depend on a local development server' >&2
            exit 1
          fi
          sha256sum dist/QuietKnight-Animal-Kingdom-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quiet-knight-animal-kingdom-debug-apk
          path: android-store/dist/QuietKnight-Animal-Kingdom-debug.apk
          if-no-files-found: error
          retention-days: 1
