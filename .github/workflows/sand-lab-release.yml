name: SAND LAB verified Android release
on:
  push:
    branches: ['sand-lab/v1.0.0']
    paths: ['sand-lab/**', '.github/workflows/sand-lab-release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sand-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test and build offline web assets
        run: npm test && npm run build
      - name: Verify exact signed release candidate
        run: |
          cp release/Sand-Lab-v1.0.0.apk .
          sha256sum -c release/SHA256SUMS.txt
          python3 scripts/verify-apk.py
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Sand-Lab-v1.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 Sand-Lab-v1.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Sand-Lab-v1.0.0.apk > release/badging.txt
          grep -q "package: name='com.andrefiker.sandlab' versionCode='1' versionName='1.0.0'" release/badging.txt
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions Sand-Lab-v1.0.0.apk | grep uses-permission
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android install and offline UI checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: cd sand-lab && python3 scripts/android-qa.py
      - name: Retain QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sand-lab-verification
          path: |
            sand-lab/docs/qa/
            sand-lab/release/
      - name: Publish authorized release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -qr Sand-Lab-v1.0.0-source.zip web android scripts tests docs package.json README.md APP_STATE.md RELEASE_NOTES.md dist .gitignore
          gh release create sand-lab-v1.0.0 --target "$GITHUB_SHA" --title 'SAND LAB v1.0.0' --notes-file RELEASE_NOTES.md release/Sand-Lab-v1.0.0.apk release/SHA256SUMS.txt Sand-Lab-v1.0.0-source.zip
          gh release download sand-lab-v1.0.0 -p Sand-Lab-v1.0.0.apk -D /tmp/sandlab-download
          cd /tmp/sandlab-download
          sha256sum -c "$GITHUB_WORKSPACE/sand-lab/release/SHA256SUMS.txt"
