name: Build Quiet Breakout APK
on:
  push:
    paths:
      - 'quiet-breakout/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-disabled: true
      - name: Run gameplay tests
        run: cd quiet-breakout && npm test
      - name: Bundle offline web assets
        run: cp -R quiet-breakout/web/. quiet-breakout/android/app/src/main/assets/
      - name: Build debug APK
        run: cd quiet-breakout/android && gradle --no-daemon :app:assembleDebug
      - name: Verify package and signature
        run: |
          APK=quiet-breakout/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.andrefiker.quietbreakout' versionCode='1' versionName='1.0.0'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-breakout-1.0.0-apk
          path: quiet-breakout/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
