name: Build Prismfall APK

on:
  push:
    branches: [ main, 'claude/pc-game-build-*' ]
    paths:
      - 'prismfall/index.html'
      - 'prismfall/assets/**'
      - 'prismfall/android/**'
      - 'prismfall/build-android.sh'
      - '.github/workflows/prismfall-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prismfall
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          yes | "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Build and verify APK
        run: |
          set -o pipefail
          mkdir -p dist
          ./build-android.sh 2>&1 | tee dist/build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prismfall-android
          path: |
            prismfall/dist/Prismfall-v*.apk
            prismfall/dist/reports/
          if-no-files-found: error

      # On feature branches, also commit the verified APK back so it can be downloaded
      # straight from the branch (pushes made with GITHUB_TOKEN do not re-trigger workflows).
      - name: Commit APK to branch
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/Prismfall-v*.apk dist/reports
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "build(prismfall): APK from ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 5; done
          exit 1
