name: Build QUIET ATC APK

on:
  push:
    branches: [ main ]
    paths:
      - 'quiet-atc/web/**'
      - 'quiet-atc/android/**'
      - 'quiet-atc/tests/**'
      - 'quiet-atc/package.json'
      - '.github/workflows/build-quiet-atc-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'quiet-atc/**'
      - '.github/workflows/build-quiet-atc-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: quiet-atc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test game engine
        run: npm test

      - name: Verify offline web bundle
        run: |
          ! grep -RniE 'https?://|fetch\(|XMLHttpRequest|WebSocket' web --exclude='*.md'
          test -f web/index.html
          test -f web/engine.js
          test -f web/game.js
          test -f web/style.css

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build and inspect APK
        working-directory: quiet-atc/android
        run: |
          gradle --no-daemon :app:assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Quiet-ATC-v1.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging ../dist/Quiet-ATC-v1.0.0.apk | tee ../dist/badging.txt
          grep -q "package: name='com.andrefiker.quietatc' versionCode='1' versionName='1.0.0'" ../dist/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose ../dist/Quiet-ATC-v1.0.0.apk
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions ../dist/Quiet-ATC-v1.0.0.apk | grep -q android.permission.INTERNET
          unzip -l ../dist/Quiet-ATC-v1.0.0.apk | grep -q 'assets/index.html'
          unzip -l ../dist/Quiet-ATC-v1.0.0.apk | grep -q 'assets/engine.js'
          unzip -l ../dist/Quiet-ATC-v1.0.0.apk | grep -q 'assets/game.js'
          unzip -l ../dist/Quiet-ATC-v1.0.0.apk | grep -q 'assets/style.css'

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: quiet-atc-android
          path: quiet-atc/dist/Quiet-ATC-v1.0.0.apk
          retention-days: 7
          if-no-files-found: error
